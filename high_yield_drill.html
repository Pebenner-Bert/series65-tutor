<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Series 65 – High-Yield 100 Drill</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1117;--surface:#1a1d27;--surface2:#242736;--border:#2e3148;
  --text:#e8eaf0;--text-muted:#8b8fa8;--accent:#4f8ef7;--accent2:#7c5cbf;
  --green:#22c55e;--red:#ef4444;--yellow:#f59e0b;--orange:#f97316;
  --radius:12px;--radius-lg:18px;
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column;font-size:15px;line-height:1.55}

/* ── HEADER ── */
#header{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;gap:10px;flex-wrap:wrap}
#header h1{font-size:17px;font-weight:700;letter-spacing:-.3px;color:var(--accent)}
#header h1 span{color:var(--text-muted);font-weight:400}
.nav-links{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.nav-link{background:var(--surface2);border:1px solid var(--border);color:var(--text-muted);border-radius:20px;padding:6px 14px;font-size:13px;cursor:pointer;white-space:nowrap;transition:all .2s;font-weight:500;text-decoration:none}
.nav-link:hover{border-color:var(--accent);color:var(--text)}

/* ── STATS BAR ── */
#stats-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;gap:14px;font-size:13px;flex-wrap:wrap}
.sb-item{display:flex;align-items:center;gap:5px}
.sb-val{font-weight:700;font-size:16px;color:var(--accent)}
.sb-lbl{color:var(--text-muted)}
#progress-wrap{flex:1;min-width:120px;height:6px;background:var(--border);border-radius:3px;overflow:hidden}
#progress-fill{height:100%;background:var(--accent);border-radius:3px;transition:width .4s}
#score-pct{font-size:18px;font-weight:800;color:var(--accent);transition:color .3s}
.score-pass{color:var(--green)!important}
.score-fail{color:var(--red)!important}

/* ── CONTROLS BAR ── */
#controls{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ctrl-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text-muted);border-radius:20px;padding:7px 14px;font-size:13px;cursor:pointer;white-space:nowrap;transition:all .2s;font-weight:500}
.ctrl-btn:hover{border-color:var(--accent);color:var(--text)}
.ctrl-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.ctrl-btn.danger{color:var(--text-muted)}
.ctrl-btn.danger:hover{border-color:var(--red);color:var(--red)}
#question-counter{color:var(--text-muted);font-size:13px;margin-left:auto}

/* ── MAIN DRILL AREA ── */
#drill-wrap{flex:1;overflow-y:auto;padding:20px 16px;display:flex;flex-direction:column;align-items:center}
#drill-wrap::-webkit-scrollbar{width:4px}
#drill-wrap::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

/* ── QUESTION CARD ── */
#q-card{width:100%;max-width:720px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;transition:border-color .25s}
#q-card.revealed-correct{border-color:var(--green)}
#q-card.revealed-wrong{border-color:var(--red)}

#q-header{padding:16px 18px 14px}
.q-meta-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:12px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px;flex-wrap:wrap}
.q-num-badge{background:var(--accent);color:#fff;border-radius:8px;padding:3px 9px;font-size:12px;font-weight:700}
.skipped-badge{background:var(--yellow);color:#000;border-radius:8px;padding:2px 8px;font-size:11px;font-weight:700}
#q-text{font-size:16px;font-weight:500;line-height:1.6;color:var(--text)}

/* ── CHOICES ── */
#q-choices{padding:4px 14px 16px;display:flex;flex-direction:column;gap:8px}
.choice-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:var(--radius);padding:12px 16px;text-align:left;font-size:14px;cursor:pointer;transition:all .2s;line-height:1.5;display:flex;align-items:flex-start;gap:10px}
.choice-btn:hover:not([disabled]){background:#2e3148;border-color:var(--accent);transform:translateX(2px)}
.choice-btn[disabled]{cursor:default;transform:none}
.choice-letter{font-weight:700;color:var(--accent);min-width:18px;flex-shrink:0}
.choice-btn.is-correct{background:#14532d!important;border-color:var(--green)!important;color:#86efac!important}
.choice-btn.is-correct .choice-letter{color:#86efac!important}
.choice-btn.is-wrong{background:#450a0a!important;border-color:var(--red)!important;color:#fca5a5!important}
.choice-btn.is-wrong .choice-letter{color:#fca5a5!important}

/* ── RATIONALE ── */
#q-rationale{margin:0 14px 16px;padding:14px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);font-size:14px;color:#c8cad8;line-height:1.65;display:none}
#q-rationale.visible{display:block}
#q-rationale .rat-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);margin-bottom:6px}
#q-result-row{padding:0 16px 10px;font-size:14px;font-weight:600;display:none;align-items:center;gap:8px}
#q-result-row.visible{display:flex}
#q-result-row.correct-res{color:var(--green)}
#q-result-row.wrong-res{color:var(--red)}

/* ── ACTION BAR ── */
#action-bar{background:var(--surface);border-top:1px solid var(--border);padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;position:sticky;bottom:0;z-index:50}
.action-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:10px 18px;font-size:14px;cursor:pointer;transition:all .2s;font-weight:500;display:flex;align-items:center;gap:6px;white-space:nowrap}
.action-btn:hover{border-color:var(--accent);color:var(--accent)}
#next-btn{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700;display:none}
#next-btn:hover{background:#3a7ef0}
#skip-btn{}
#restart-btn{margin-left:auto}
#skip-btn:hover{border-color:var(--yellow);color:var(--yellow)}

/* ── FINISHED SCREEN ── */
#finished-screen{display:none;flex-direction:column;align-items:center;gap:16px;padding:30px 16px;max-width:600px;margin:0 auto;width:100%}
.fin-card{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px;text-align:center}
.fin-score{font-size:58px;font-weight:800;color:var(--accent);line-height:1}
.fin-pf{font-size:22px;font-weight:700;margin-top:8px}
.fin-pf.pass{color:var(--green)}
.fin-pf.fail{color:var(--red)}
.fin-detail{color:var(--text-muted);font-size:14px;margin-top:6px}
.fin-breakdown{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px}
.fin-breakdown h3{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);margin-bottom:12px}
.fin-stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fin-stat{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px}
.fin-stat .fs-val{font-size:24px;font-weight:700;color:var(--accent)}
.fin-stat .fs-lbl{font-size:12px;color:var(--text-muted);margin-top:2px}
.fin-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:100%}

/* ── RESPONSIVE ── */
@media(max-width:520px){
  #q-text{font-size:15px}
  .fin-score{font-size:44px}
  .fin-stat-grid{grid-template-columns:1fr 1fr}
}
</style>
</head>

    <div id="q-result-row"></div>

  </div>

  <!-- Finished Screen (hidden until all done) -->
  <div id="finished-screen">
    <div class="fin-card">
      <div class="fin-score" id="fin-score-val">—</div>
      <div class="fin-pf" id="fin-pf">—</div>

    </div>

      <h3>Session Summary</h3>
      <div class="fin-stat-grid">
        <div class="fin-stat"><div class="fs-val" id="fs-correct">—</div><div class="fs-lbl">Correct</div></div>
        <div class="fin-stat"><div class="fs-val" id="fs-wrong">—</div><div class="fs-lbl">Wrong</div></div>

      </div>
    </div>
    <div class="fin-actions">
      <button class="action-btn" style="background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700" onclick="restartDrill()">🔁 Drill Again</button>

    </div>

</div>

<!-- BOTTOM ACTION BAR -->
<div id="action-bar">

  <button class="action-btn" id="next-btn" onclick="nextQuestion()">Next Question →</button>
  <button class="action-btn" id="restart-btn" onclick="confirmRestart()" style="margin-left:auto">↺ Restart</button>
</div>

<script>
/* ────────────────────────────────────────────────────────────

const DRILL_QUESTIONS = [{"num": 1, "question": "A mutual fund holds a thinly traded convertible bond whose last trade occurred two months ago. A large shareholder has requested a redemption that will force the fund to determine a reliable price for that bond. Which procedure best meets fair-value pricing responsibilities?", "choices": {"a": "Use the bond’s last trade price and assume a small liquidity premium is already embedded.", "b": "Obtain broker/dealer quotes and, if necessary, apply a valuation technique (e.g., discounted cash flows or matrix pricing) to estimate fair value.", "c": "Value the bond at par because convertibles typically trade near par on redemption days.", "d": "Delay the NAV calculation until a trade occurs so only actual market transactions set the price."}, "correct": "b", "rationale": "For thinly traded securities, fair-value pricing requires seeking observable inputs (broker quotes) and applying valuation techniques when quotes are unreliable; relying solely on stale trades or delaying NAV is inappropriate."}, {"num": 2, "question": "A client holds a concentrated long position in a volatile biotech stock and wants explicit downside protection for three months while retaining unlimited upside. Which options strategy best meets the client’s objective?", "choices": {"a": "Sell out-of-the-money covered calls to generate premium and partially offset losses.", "b": "Buy protective (long) puts with a three-month expiration to limit downside while keeping upside potential.", "c": "Sell naked (uncovered) puts at a near strike to collect premium and reduce downside exposure.", "d": "Write a cash-secured put to earn premium and potentially acquire the stock at a lower price."}, "correct": "b", "rationale": "A long protective put limits downside (acts like insurance) and preserves unlimited upside; selling options generates premium but does not provide firm downside protection and can increase risk."}, {"num": 3, "question": "A taxable investor in the 24% ordinary tax bracket is choosing between (1) a stock expected to pay qualified dividends yielding 3.2% and (2) a municipal bond yielding 2.2%. Assuming the qualified dividends are taxed at the 15% long-term rate, which choice provides the higher after-tax yield?", "choices": {"a": "The municipal bond, because its yield is tax-exempt and avoids both ordinary and capital gains taxes", "b": "Both investments provide the same after-tax yield since 3.2% × (1 − 0.15) equals 2.2%", "c": "The stock paying qualified dividends, because its after-tax yield is 3.2% × (1 − 0.15) = 2.72%, which exceeds 2.2%", "d": "The stock only if the investor holds it less than one year to qualify for short-term tax treatment"}, "correct": "c", "rationale": "Qualified dividends taxed at 15% result in an after-tax yield of 2.72% (3.2% × 0.85), which is higher than the muni’s 2.2%, so the dividend-paying stock gives the superior after-tax return in this scenario."}, {"num": 4, "question": "A parent wants to transfer $25,000 in marketable securities to an account for their 10-year-old child without creating a formal trust. The parent wants to control investments for the child until the child reaches the age of majority. Which account registration is most appropriate?", "choices": {"a": "Custodial account under UGMA/UTMA (e.g., “Parent, Custodian for Child under the UTMA of State”)", "b": "Joint account titled “Parent and Child”", "c": "Revocable living trust naming the child as beneficiary", "d": "Irrevocable trust naming the child as beneficiary"}, "correct": "a", "rationale": "UGMA/UTMA custodial accounts allow a custodian (usually a parent) to hold assets for a minor until state-specified age; joint accounts with a minor are not appropriate and trusts are unnecessary for a simple custodial transfer."}, {"num": 5, "question": "An adviser met a new elderly client once and, without documenting the client’s financial circumstances or risk tolerance, invested 60% of the portfolio in small-cap growth funds. The client later states they prefer conservative, income-producing investments. Which is the most appropriate immediate remedial action for the adviser under fiduciary duty?", "choices": {"a": "Explain that the investments were suitable at the time and charge an advisory fee for the portfolio management services provided.", "b": "Convert the account to a commission-based account so trading in aggressive funds is covered by sales agreements.", "c": "Cease making further purchases, obtain complete KYC information (objectives, risk tolerance, liquidity needs), disclose the suitability issue, recommend suitable income-focused adjustments, and document all steps taken.", "d": "Ignore the complaint if the account had gains, since losses would have required remediation but gains negate suitability concerns."}, "correct": "c", "rationale": "Fiduciaries must gather and document Know-Your-Client (KYC) information before making recommendations; if the current holdings conflict with the client’s stated preferences, the adviser must stop unsuitable activity, obtain the missing KYC data, recommend suitable alternatives, and document remediation."}, {"num": 6, "question": "A client turns 73 this year and has an IRA. By when must the client take the first required minimum distribution (RMD) to avoid the 50% excise tax for failure to withdraw?", "choices": {"a": "By April 1 of the year following the year the client turns 73.", "b": "By April 1 of the year the client turns 73.", "c": "By December 31 of the year the client turns 70½.", "d": "RMDs are not required for IRAs; only employer plans require them."}, "correct": "a", "rationale": "Under current rules RMDs generally begin at age 73; the first RMD may be delayed until April 1 of the year after turning 73 (subsequent RMDs must be taken by December 31 each year)."}, {"num": 7, "question": "An individual is named executor and trustee under a decedent’s will and needs to open an account to manage assets placed into a testamentary trust. Which documentation will a broker-dealer most likely require?", "choices": {"a": "Only the decedent’s death certificate", "b": "Only the trustee’s personal identification and social security number", "c": "A copy of the trust instrument (or will establishing the testamentary trust) and evidence of the trustee’s authority (e.g., letters testamentary or trustee’s certificate)", "d": "Only the grantor’s living revocable trust document"}, "correct": "c", "rationale": "For testamentary trusts the firm needs the trust instrument (or relevant will provisions) and proof the named executor/trustee has authority—commonly letters testamentary or a trustee’s certification; ID alone is insufficient."}, {"num": 8, "question": "A conservative, taxable investor wants the municipal holding with the lowest credit risk even if it yields less. Which municipal security below best fits that objective?", "choices": {"a": "Revenue bond issued by a small private hospital with sole reliance on its patient revenue stream.", "b": "Revenue bond issued for a single-purpose toll road that depends on projected traffic volume.", "c": "General obligation bond of a large state with a broad, diversified tax base and constitutional taxing power.", "d": "Industrial development bond backed primarily by lease payments from a single private company."}, "correct": "c", "rationale": "General obligation bonds backed by the issuer’s taxing power and a diversified tax base typically have lower credit risk than single-purpose revenue or private activity bonds that rely on one revenue source."}, {"num": 9, "question": "A client repeatedly deposits cash in amounts just under $10,000 and quickly withdraws it; the pattern appears designed to avoid reporting thresholds. What should the adviser do first?", "choices": {"a": "Contact the client and ask them to explain the transactions before taking any further action", "b": "Close the client’s account immediately and return the funds", "c": "File a Suspicious Activity Report (SAR) with FinCEN within the required timeframe and do not inform the client about the SAR", "d": "Notify other clients who have similar transaction patterns so they can be monitored"}, "correct": "c", "rationale": "Suspected structuring should prompt filing a SAR with FinCEN (within the required timeframe, generally 30 days of detection) and SARs must remain confidential — do not alert the client or others."}, {"num": 10, "question": "A company retirement plan fiduciary is selecting the investment lineup for a new 401(k) plan. Which action best demonstrates compliance with ERISA fiduciary duties?", "choices": {"a": "Filling the lineup with funds that had the highest returns over the past three years regardless of cost or diversification, since past performance predicts future results.", "b": "Selecting a set of low‑cost, diversified investment options after a documented review of fees, risk, and suitability for the participant population.", "c": "Including only the recordkeeper’s proprietary funds because they offered a small rebate to the plan.", "d": "Relying solely on a single vendor’s marketing materials and verbal assurances without documenting the decision process."}, "correct": "b", "rationale": "ERISA fiduciaries must act prudently and solely in participants’ interests — selecting low‑cost, diversified options based on a documented, reasoned review satisfies the duty of prudence and loyalty."}, {"num": 11, "question": "Two comparable companies in the same industry have identical expected earnings growth rates of 8% next year. Company X trades at a P/E of 22, while Company Y trades at a P/E of 16. Assuming no other differences in risk or fundamentals, which statement is most accurate?", "choices": {"a": "Company X is undervalued because higher P/E indicates stronger investor confidence.", "b": "Company Y appears relatively undervalued compared with Company X, since both have the same growth and Y has the lower P/E.", "c": "Both companies are fairly valued because P/E differences reflect market inefficiencies rather than fundamentals.", "d": "Company X must have a lower dividend yield than Company Y as a rule, making it more attractive for growth investors."}, "correct": "b", "rationale": "With identical growth and risk, the lower P/E suggests Company Y is cheaper on a price‑to‑earnings basis (PEG = P/E ÷ growth would be lower), indicating relative undervaluation."}, {"num": 12, "question": "Investor C sells 500 shares of DEF stock at a $6,000 loss on December 10 to harvest tax losses and then buys 500 shares of a substantially identical ETF on December 20. What is the tax consequence of the December 10 sale?", "choices": {"a": "The $6,000 loss is disallowed under the wash sale rule and is added to the cost basis of the replacement ETF", "b": "The $6,000 loss is fully deductible against ordinary income this tax year with no basis adjustment", "c": "The loss is allowed to offset capital gains but cannot be carried forward", "d": "The $6,000 loss is permanently disallowed and cannot be used in any way"}, "correct": "a", "rationale": "Purchasing a substantially identical security within 30 days before or after the sale triggers the wash sale rule; the loss is disallowed for current deduction and instead added to the basis of the replacement shares."}, {"num": 13, "question": "You hold a 20-year corporate bond with a 6% coupon when market yields rise from 6% to 7%. Which of the following statements about the bond is most accurate?", "choices": {"a": "The bond’s coupon payments will immediately decrease to 5% because coupons reset when yields change.", "b": "The bond’s current yield will remain exactly 6% because coupon/face value is unchanged.", "c": "The issuer is more likely to call the bond after yields rise, reducing your reinvestment risk.", "d": "The bond’s price will fall, and the percentage price decline will be larger than for a similar 5-year bond with the same coupon."}, "correct": "d", "rationale": "When market yields rise, bond prices fall. Longer-duration (longer maturity) bonds experience larger percentage price declines for a given change in yield than shorter-maturity bonds with the same coupon."}, {"num": 14, "question": "A long-term, low-turnover retiree asks an adviser whether to move from a commission-based brokerage account to a wrap/fee-based advisory account. The adviser stands to earn more under a fee-based arrangement, but the retiree makes only a few trades per year. Under fiduciary standards, what should the adviser do?", "choices": {"a": "Recommend the fee-based account because it aligns the adviser’s interests with the client’s and is therefore always superior.", "b": "Refuse to discuss compensation structures since the client is not knowledgeable about fees.", "c": "Perform a cost-comparison (estimate total cost under each arrangement based on expected activity), disclose the conflict and differences, and recommend the account type that is demonstrably in the client’s best interest.", "d": "Recommend keeping the commission account because clients should avoid fee-based accounts when advisers get paid fees."}, "correct": "c", "rationale": "A fiduciary must analyze whether a fee or commission arrangement benefits the client based on expected trading activity, disclose conflicts, and recommend the option that is in the client’s best interest."}, {"num": 15, "question": "A single parent, age 38, with one job and two dependent children meets you for an initial planning interview. They want an IPS that addresses liquidity needs. Which guideline is most appropriate to include in the IPS regarding an emergency reserve?", "choices": {"a": "Maintain an emergency reserve equal to one month of living expenses because investments can be liquidated quickly if needed.", "b": "Keep no dedicated emergency fund and rely on a line of credit for unexpected expenses to maximize investment returns.", "c": "Maintain an emergency reserve equal to 6–12 months of living expenses because single-income households have lower risk capacity and higher liquidity needs.", "d": "Invest the emergency reserve entirely in equities to preserve purchasing power over time."}, "correct": "c", "rationale": "Single-income households with dependents face higher liquidity risk and lower capacity to absorb shocks. An IPS should recommend a larger emergency reserve (commonly 6–12 months) held in conservative, liquid vehicles."}, {"num": 16, "question": "A client purchased 200 shares of XYZ at $50 per share two months ago. Concerned about near-term downside risk, the client buys 2 XYZ puts with a $45 strike, paying $3 per share in premium. Ignoring commissions, what is the effective break-even price for the client’s combined stock + protective put position?", "choices": {"a": "$42 per share (strike minus premium).", "b": "$48 per share (purchase price minus premium).", "c": "$53 per share (purchase price plus premium).", "d": "$45 per share (the put strike price)."}, "correct": "c", "rationale": "For a protective put the investor’s break-even equals the original stock purchase price plus the premium paid for the put; the put strike determines the downside floor, not the break-even."}, {"num": 17, "question": "An issuer plans a Rule 506(c) offering that will use general solicitation. As the adviser structuring the deal, which of the following best describes the issuer’s obligation to verify investor accreditation under 506(c)?", "choices": {"a": "The issuer may rely solely on investors’ self‑certifications of accredited status since Form D will be filed.", "b": "No verification is necessary if all investors previously invested with the issuer in a private placement.", "c": "The issuer only needs to verify accreditation for investors who are not natural persons (e.g., entities).", "d": "The issuer must take reasonable steps to verify each accredited investor (e.g., review W‑2s, tax returns, bank/brokerage statements, or obtain a written confirmation from a registered broker‑dealer, SEC‑registered investment adviser, CPA, or attorney)."}, "correct": "d", "rationale": "Rule 506(c) permits general solicitation but requires issuers to take reasonable steps to verify accredited status (documentary verification such as tax returns, statements, or letters from certain professionals). Self‑certification alone is insufficient."}, {"num": 18, "question": "A municipal plan needs $5 million to pay a known liability exactly 7 years from now. The plan wants to ensure the assets will fund the obligation even if yields change slightly. Which action best accomplishes this objective?", "choices": {"a": "Construct a bond portfolio whose Macaulay duration equals 7 years and whose present value equals the liability (immunization)", "b": "Build a barbell portfolio with a large portion in long-term bonds and some short-term bonds for liquidity", "c": "Ladder maturities evenly from 1 to 10 years to reduce reinvestment risk", "d": "Concentrate holdings in high-coupon short-term bonds to reduce price volatility"}, "correct": "a", "rationale": "Immunization requires matching portfolio duration to the liability horizon and matching PVs so the portfolio will fund the known future payment despite small yield changes."}, {"num": 19, "question": "Mrs. Patel has $40,000 invested in Fund X (a family of funds) that charges a front-end sales load with a breakpoint at $50,000. She plans to purchase an additional $11,000 of Fund X. The fund offers a right of accumulation (ROA) that allows existing holdings in the fund family to be counted toward breakpoints. Which of the following is the most likely outcome if she properly documents her existing holdings when placing the $11,000 order?", "choices": {"a": "She must wait until the $11,000 purchase clears and then ask for a refund of any excess sales charge once account value reaches $50,000.", "b": "She will be ineligible for the breakpoint because ROAs apply only to purchases made at the same time as the original investment.", "c": "The ROA will only apply if she first signs a letter of intent to purchase the remaining $9,000 within 30 days.", "d": "Her existing $40,000 plus the new $11,000 can be aggregated under the ROA, so the $11,000 purchase will qualify for the reduced sales charge at the $50,000 breakpoint."}, "correct": "d", "rationale": "Rights of accumulation allow current holdings in the same fund family to be aggregated with a new purchase to qualify for breakpoint discounts; with proper documentation her $40k + $11k meets the $50k breakpoint for the new purchase."}, {"num": 20, "question": "You purchase a 10-year corporate bond with a $1,000 par value that pays a 6% annual coupon. The bond currently trades at $940 in the secondary market. Which of the following statements is most accurate?", "choices": {"a": "The current yield is 6.38%; the yield to maturity (YTM) is lower than the current yield because the bond trades at a discount.", "b": "The current yield is 6.38%; the YTM equals the current yield whenever the bond price is different from par.", "c": "The current yield is 6.38%; the YTM is higher than the current yield because the bond trades at a discount.", "d": "The current yield is 6.00%; the YTM is higher than the current yield because the bond trades at a discount."}, "correct": "c", "rationale": "Current yield = annual coupon / market price = $60 / $940 ≈ 6.38%. A bond trading below par (discount) has a YTM greater than its current yield (and greater than the coupon rate) because the investor also realizes a capital gain to par at maturity."}, {"num": 21, "question": "An ETF is trading at a persistent premium to its NAV because market demand for the ETF shares is high. Which action by an authorized participant (AP) will help bring the ETF’s market price back in line with NAV?", "choices": {"a": "The AP will short the ETF shares and buy the underlying securities to profit from the spread", "b": "The AP will request the ETF sponsor to lower the management fee to reduce the premium", "c": "The AP will buy ETF shares on the exchange and hold them to capture the premium", "d": "The AP will buy the underlying basket of securities and deliver them in-kind to the ETF sponsor in exchange for creation units, increasing supply of ETF shares"}, "correct": "d", "rationale": "When ETF shares trade at a premium, APs can purchase the underlying securities and exchange them in-kind for creation units (ETF shares); selling those shares increases ETF supply and arbitrages the premium toward NAV."}, {"num": 22, "question": "A client owns real estate in three different states and is concerned about the time and expense of probate in multiple jurisdictions. Which recommendation most effectively minimizes the likelihood of ancillary probates in those states?", "choices": {"a": "Open a joint tenancy with right of survivorship on each property with a child who lives in the client’s home state.", "b": "Name the client’s residuary estate in the will to receive all properties and allow a single probate in the home state.", "c": "Transfer title of each property to a family limited partnership (FLP) without further estate planning documents.", "d": "Fund a properly drafted and funded revocable living trust that holds title to all real estate; the successor trustee can transfer property without ancillary probate."}, "correct": "d", "rationale": "A revocable living trust, when properly funded (real estate retitled into the trust), avoids ancillary probate in other states because the successor trustee can transfer title without court proceedings; wills require probate in each state where property is located."}, {"num": 23, "question": "A long-term investor plans to invest $250,000 in a single mutual fund and wants to minimize total costs over a 15-year horizon. The investor is eligible for sales charge breakpoints. Which share class is likely the most cost-effective?", "choices": {"a": "Class B shares, because the back-end load declines and the shares will always convert to A after a few years", "b": "Class C shares, because they have no front-end load and low early redemption charges", "c": "Class A shares, because a large upfront purchase can qualify for breakpoint discounts on the front-end load, lowering long-term cost", "d": "An ETF, because ETFs never have any ongoing fees and will always be cheaper than mutual funds"}, "correct": "c", "rationale": "For a large, long-term investment, Class A shares can be most cost-effective because breakpoint discounts reduce the front-end sales charge; over many years the lower ongoing expenses versus level-load shares often produce the lowest total cost."}, {"num": 24, "question": "A client tells you she recently updated her will to leave her IRA to her two adult children equally, but she asks whether that change will ensure the IRA assets are split at her death. What should you tell her?", "choices": {"a": "Yes — a valid will controls the distribution of all your assets, including IRAs, regardless of beneficiary forms.", "b": "No — beneficiary designations on the IRA contract control distributions; she must update the IRA beneficiary form to match her will.", "c": "Only if she files the will with the IRA custodian before death will the will supersede the beneficiary designation.", "d": "If she names her estate as beneficiary in the will, the IRA will bypass probate and be divided per the will."}, "correct": "b", "rationale": "Retirement accounts pass according to the account’s beneficiary designation, not the will; to change who receives the IRA she must update the IRA beneficiary form."}, {"num": 25, "question": "An adviser’s firm is arranging a private placement offered by an affiliated sponsor. Several advisers and employees want to invest personally before client subscriptions are accepted. To mitigate conflicts and comply with fiduciary duties and a typical code of ethics, which policy should the firm adopt?", "choices": {"a": "Require pre-approval for employee participation in the private placement, document and disclose the allocation policy to clients (prioritizing client subscriptions before employee allocations), and maintain records of allocations.", "b": "Allow employees to invest on a first-come, first-served basis since employee investments show the firm’s confidence in the offering.", "c": "Permit employees to invest but only after the firm has met its minimum fundraising target, without additional disclosure.", "d": "Prohibit employees from investing and keep the prohibition confidential to avoid attracting regulatory attention."}, "correct": "a", "rationale": "Firms should require pre-approval for employee participation in private offerings, document and follow a written allocation policy that protects client interests (clients generally get priority), and keep records."}, {"num": 26, "question": "A high-income client wants broad equity exposure inside a taxable account and is most concerned about minimizing annual taxable capital gains distributions. Which of the following is the best recommendation?", "choices": {"a": "An actively managed mutual fund with a long track record of outperformance", "b": "An exchange-traded fund (ETF) that tracks a broad equity index", "c": "A taxable bond mutual fund focused on municipal securities", "d": "A unit investment trust (UIT) holding a fixed basket of equities"}, "correct": "b", "rationale": "ETFs use in-kind creation/redemption and tend to be more tax efficient than most mutual funds, reducing the likelihood of taxable capital gains distributions in a taxable account."}, {"num": 27, "question": "The yield curve has inverted: the 2-year Treasury yields 3.0% while the 10-year yields 2.2%. An investor expecting an economic downturn that will push interest rates lower should most likely take which action?", "choices": {"a": "Shift into short-term Treasury bills to lock in the currently higher short-term yield and avoid duration risk.", "b": "Purchase long-term Treasury bonds to gain price appreciation if short-term rates fall in a recession.", "c": "Increase allocation to high-yield corporate bonds to pick up extra yield in a slowing economy.", "d": "Switch to floating-rate bank loans because they will increase in value when long-term yields fall."}, "correct": "b", "rationale": "An inverted yield curve often signals recession and expected declines in short-term rates; if rates fall, long-term bond prices generally rise more, so buying long-term Treasuries would capture potential capital gains."}, {"num": 28, "question": "A pension fund expects interest rates to remain stable for several years but wants to target a specific cash need in 5 years and maximize yield without creating significant reinvestment timing risk. Which fixed-income strategy is best?", "choices": {"a": "Bullet strategy: concentrate maturities around the 5-year point to match the cash need and maximize yield", "b": "Laddering: stagger maturities evenly from 1-9 years to smooth reinvestment", "c": "Barbell: allocate to 1-year and 10-year bonds to benefit from both ends of the curve", "d": "Full immunization: match duration to the 5-year horizon and ignore maturity matching"}, "correct": "a", "rationale": "A bullet concentrates maturities at the target date, aligning cash flows with the liability and typically achieving a higher yield than widely staggered ladders while limiting reinvestment timing risk."}, {"num": 29, "question": "You are comparing two portfolios that have identical expected returns of 9% and the same risk-free rate of 2%. Portfolio A has a standard deviation of 12%; Portfolio B has a standard deviation of 8%. Which of the following statements is most accurate?", "choices": {"a": "Portfolio A has a higher Sharpe ratio because it has higher total volatility.", "b": "Portfolio B has the higher Sharpe ratio because it has the same excess return but lower standard deviation.", "c": "Both portfolios have the same Sharpe ratio because expected returns are equal.", "d": "Portfolio A has a higher alpha because alpha increases with standard deviation."}, "correct": "b", "rationale": "Sharpe = (Rp - Rf)/σ. With identical excess return (9% - 2% = 7%), the portfolio with the lower σ (8%) has the larger Sharpe. Higher SD does not increase Sharpe or alpha."}, {"num": 30, "question": "An issuer is conducting a private placement under Rule 506(c) and is soliciting investors through an online campaign. A prospective investor tells you verbally that his annual income exceeds $200,000. As the adviser facilitating the investment, what must you do before allowing him to subscribe?", "choices": {"a": "Accept his verbal statement and allow the investment because the advisor can rely on the investor’s representation.", "b": "Take reasonable steps to verify his accredited investor status (e.g., tax returns, bank statements, or written confirmation from a third party) because 506(c) requires verification.", "c": "Refuse the investment because all private placements are limited only to institutional investors.", "d": "Ask the issuer to verify the investor’s status; the adviser has no obligation to perform verification."}, "correct": "b", "rationale": "Rule 506(c) permits general solicitation but requires the issuer (and those facilitating the sale) to take reasonable steps to verify that purchasers are accredited investors rather than merely relying on their representations."}, {"num": 31, "question": "An investment adviser firm receives soft-dollar credits from a broker-dealer in exchange for routing certain client trades to that broker. The credits are being used to purchase research subscriptions and occasional office furniture. Under Advisers Act guidance and best practices, what action should the firm’s CCO take immediately?", "choices": {"a": "Continue the arrangement because any goods and services purchased with soft dollars are permissible so long as the broker provides the credits.", "b": "Stop using soft dollars for non-research items (e.g., furniture), document that soft dollars are used only for research that benefits clients, and disclose the soft-dollar arrangement in the firm’s Form ADV Part 2.", "c": "Require written client consent before placing any trades through that broker-dealer, since soft-dollar arrangements always require client approval.", "d": "Shift all trades to anonymous crossing networks to avoid soft-dollar conflicts without changing current purchases made with credits."}, "correct": "b", "rationale": "Soft dollars may be used for bona fide research that benefits clients, but not for unrelated items (like furniture); advisers must disclose soft-dollar practices in Form ADV and ensure arrangements serve clients’ best interests."}, {"num": 32, "question": "A 58-year-old high-earner with a large traditional IRA asks whether converting the IRA to a Roth IRA is allowed and what the tax effect would be. Which statement is correct?", "choices": {"a": "A conversion from a traditional IRA to a Roth IRA is permitted regardless of income, and the converted amount is taxable in the year of conversion.", "b": "High earners are barred from converting traditional IRAs to Roth IRAs; conversions are allowed only if modified adjusted gross income is below a specified threshold.", "c": "A conversion is tax-free as long as the owner is over age 59½; taxes are due only on future withdrawals.", "d": "A conversion automatically avoids the 10% early withdrawal penalty on pre-age-59½ distributions without tax consequences."}, "correct": "a", "rationale": "Roth conversions are permitted regardless of income; converted pre‑tax amounts are included in taxable income in the year of conversion (recharacterizations of conversions are no longer allowed)."}, {"num": 33, "question": "An adviser believes equities are overvalued for the next 3-6 months but remains comfortable with the client’s long-term strategic allocation to equities. Which action best represents an appropriate tactical shift while leaving the strategic allocation intact?", "choices": {"a": "Permanently lowering the client’s strategic equity target from 60% to 40% and updating the IPS.", "b": "Changing the client’s investment objective from growth to capital preservation.", "c": "Halting all new contributions to equity funds until valuations normalize.", "d": "Temporarily reducing equity exposure by overweighting cash/short-term bonds for 3-6 months while documenting the tactical sleeve."}, "correct": "d", "rationale": "A tactical shift is temporary and documented; temporarily overweighting cash/short-term bonds keeps the strategic target intact while expressing a short-term view. Permanently changing targets or objectives is a strategic change."}, {"num": 34, "question": "A 68-year-old retired client with a low risk tolerance and a primary objective of generating stable income meets with an investment adviser representative (IAR). The IAR’s firm manages a proprietary mutual fund that is equity-growth oriented, has higher fees, and has outperformed peers during the past bull market. The IAR is compensated more for placing a client in the firm’s proprietary fund and also would earn a larger ongoing fee in a fee-based wrap account than in a commission account. After a 30-minute meeting, the IAR recommends the proprietary growth fund in a fee-based wrap account without discussing alternatives. Which action would best satisfy the IAR’s fiduciary duty to the client?", "choices": {"a": "Recommend the firm’s proprietary fund in the fee-based wrap account because it has recently outperformed peers and the IAR believes performance will continue.", "b": "Recommend the proprietary fund but place it in a commission account so the client pays only transaction costs rather than an ongoing advisory fee.", "c": "Avoid recommending any proprietary product because accepting no proprietary business would eliminate the appearance of a conflict, regardless of whether the proprietary fund is suitable.", "d": "Fully document the KYC information, disclose the IAR’s and firm’s conflict of interest and fee differences, compare total costs and suitability of proprietary and nonproprietary alternatives, and recommend the option that is demonstrably in the client’s best interest even if it is a nonproprietary, lower-cost solution."}, "correct": "d", "rationale": "Fiduciary duty requires knowing the client, performing a best‑interests analysis, and making full and fair disclosure of conflicts and compensation differences. The adviser must compare alternatives and recommend the solution that best meets the client’s objectives—even if that means recommending a nonproprietary, lower‑cost product—and document the process."}, {"num": 35, "question": "A registered investment adviser has the following: (1) a soft-dollar arrangement with Broker A for research; (2) a solicitor agreement that pays cash referral fees to other professionals for client introductions; and (3) is selling an affiliated private investment to clients. Which set of actions best addresses the compliance and disclosure requirements for these combined conflicts?", "choices": {"a": "Disclose the affiliated private investment in marketing materials only; keep the soft-dollar and solicitor arrangements as internal matters to avoid confusing clients.", "b": "Eliminate the soft-dollar arrangement and stop using solicitors; no further disclosures are necessary once arrangements cease.", "c": "Disclose soft-dollar practices in Form ADV Part 2, maintain solicitor agreements and ensure solicitors provide written disclosures to prospective clients, implement and disclose a written allocation policy for the affiliated private investment, and ensure soft-dollar purchases are bona fide research benefiting clients.", "d": "Aggregate all conflicts into a single boilerplate disclosure provided only to new clients and rely on their implied consent by continued service."}, "correct": "c", "rationale": "Advisers must make specific disclosures (ADV Part 2 for soft dollars), have written solicitor agreements and solicitor disclosures, adopt written allocation policies for affiliated private investments, and ensure soft dollars are used for client‑benefiting research."}, {"num": 36, "question": "Investor B purchased shares of ABC Inc. on January 1, 2023 and sold them on July 15, 2023 at a gain. Which statement best describes the tax treatment of the gain?", "choices": {"a": "The gain is taxed at the preferential long-term capital gains rates because the holding period exceeded 6 months.", "b": "The gain is taxed at ordinary income rates because the holding period was less than one year.", "c": "The gain is tax-exempt if the investor reinvests in the same security within 30 days.", "d": "The gain is taxed as qualified dividends if the company paid dividends while held."}, "correct": "b", "rationale": "Gains on assets held one year or less are short-term and taxed at the investor’s ordinary income tax rates; holding less than 12 months means short-term treatment."}, {"num": 37, "question": "An RIA begins offering a new proprietary mutual fund that pays the firm a distribution fee. Which of the following is the firm’s primary compliance obligation under Form ADV Part 2A (the brochure) regarding this arrangement?", "choices": {"a": "List the proprietary fund only in Part 1 of Form ADV and omit it from the narrative brochure to avoid confusing clients.", "b": "Disclose the conflict of interest prominently in the Part 2A brochure, explain how the conflict is managed, and obtain informed client consent where required.", "c": "Disclose the proprietary fund only in a separate addendum sent upon client request.", "d": "File an immediate Rule 206(4)-2 waiver request with the SEC to permit proprietary product recommendations without disclosure."}, "correct": "b", "rationale": "Form ADV Part 2A must clearly disclose material conflicts of interest (such as recommending proprietary products and receiving fees) and explain how they are managed; clients should be informed and consent obtained where appropriate."}, {"num": 38, "question": "A 35% federal tax bracket client is comparing a 4.5% tax-exempt municipal bond to a 6.5% taxable corporate bond. Which recommendation is most appropriate based on after-tax yield?", "choices": {"a": "Recommend the corporate bond because its nominal yield is higher (6.5%).", "b": "Recommend the municipal bond because its tax-equivalent yield (4.5% ÷ (1 − 0.35) = 6.92%) exceeds the corporate yield.", "c": "Recommend the corporate bond because municipal bonds are always riskier than corporates.", "d": "Recommend the municipal only if the bond is issued in the client’s state of residence."}, "correct": "b", "rationale": "Compute tax-equivalent yield: TEY = tax-free yield / (1 − tax rate). 4.5% / 0.65 = 6.92%, which is higher than the 6.5% corporate yield, so the muni yields a better after-tax return for this client."}, {"num": 39, "question": "A corporate bond with $1,000 par pays a 6% annual coupon and is trading at 92 (i.e., $920). Which statement about yields is correct?", "choices": {"a": "The current yield is 6% because the coupon is 6%, and YTM is the same whenever a bond is trading above or below par.", "b": "The current yield is 6.52% and the yield-to-maturity must be lower than the current yield because the bond is trading at a discount.", "c": "The current yield is 5.52% and YTM is lower because the bond trades below par.", "d": "The current yield is approximately 6.52% (60/920) and the yield-to-maturity will be higher than the current yield because the bond is trading at a discount (capital gain to maturity)."}, "correct": "d", "rationale": "Current yield = annual coupon ÷ market price = $60 ÷ $920 ≈ 6.52%. Because the bond sells below par, an investor also expects a capital gain at maturity, so YTM > current yield."}, {"num": 40, "question": "An issuer is considering using Rule 504 (Reg D) versus Rule 506 for a multi-state private placement. In advising the issuer about state blue-sky laws, which of the following is the most accurate statement?", "choices": {"a": "All Regulation D exemptions preempt state blue-sky laws, so no state filings or fees apply under either Rule 504 or Rule 506.", "b": "Filing a Form D with the SEC automatically satisfies all state filing requirements for any Reg D exemption.", "c": "Rule 504 is federal preemption for offers up to $5 million and therefore prevents states from requiring any notice filing.", "d": "Rule 506 offerings have federal preemption from state registration (substantive review), but states may still require notice filings and fees; Rule 504 generally does not afford the same preemption and states can require registration."}, "correct": "d", "rationale": "Rule 506 is federally preemptive of state registration (states can only require notice/fees), whereas Rule 504 does not provide the same broad preemption and is subject to state registration requirements in many jurisdictions."}, {"num": 41, "question": "You own a convertible corporate bond priced at $1,200 with a conversion ratio of 30 shares. The underlying common stock currently trades at $35 per share. Which statement best describes the economic choice facing you now?", "choices": {"a": "You should convert now because the conversion will immediately yield a profit compared with the bond’s market price.", "b": "You should convert now and sell the shares because conversion eliminates interest rate risk and gives higher income.", "c": "Conversion is not presently attractive: conversion value is 30 × $35 = $1,050, below the bond price of $1,200; the stock must rise to $40 per share for parity (1,200/30).", "d": "Because conversion value is less than the bond price, the bond will always trade at a premium to conversion value until maturity."}, "correct": "c", "rationale": "Conversion value = conversion ratio × stock price = 30 × $35 = $1,050, which is less than the bond’s $1,200 market price. To reach parity the stock needs to be $40 (1,200 ÷ 30). Converting now would be disadvantageous."}, {"num": 42, "question": "A high-net-worth client holds most assets in taxable accounts and wants to minimize realized capital gains when rebalancing. Which rebalancing approach is MOST tax-efficient?", "choices": {"a": "Sell appreciated positions across the board to bring allocations back to target and then repurchase desired exposures", "b": "Use new contributions and withdrawals to rebalance first, then employ tax-efficient techniques (e.g., tax-loss harvesting, sell lots with losses) before selling appreciated holdings", "c": "Rebalance monthly regardless of tax consequences to keep volatility low", "d": "Rebalance by selling only the largest positions regardless of tax basis"}, "correct": "b", "rationale": "For taxable accounts, prioritize using cash flows (contributions/withdrawals) and tax-aware trades (loss harvesting, selling high-basis lots) before selling appreciated positions, which would trigger taxable gains."}, {"num": 43, "question": "A client is worried about receiving large taxable capital gains distributions from an actively managed mutual fund. She wants a pooled vehicle with a fixed portfolio so turnover is minimal. Which product best matches her concern?", "choices": {"a": "An actively managed open-end mutual fund that emphasizes tax-efficient trading", "b": "A broad-based index mutual fund with daily active rebalancing", "c": "A synthetic ETF that uses derivatives to track the index", "d": "A unit investment trust (UIT) that purchases a fixed portfolio and holds it for the trust term"}, "correct": "d", "rationale": "UITs assemble a fixed portfolio at inception and generally do not have active trading, which limits manager-driven capital gains distributions compared with actively managed mutual funds."}, {"num": 44, "question": "A mutual fund has a long-term appreciated security in its portfolio and decides to make an in-kind capital gain distribution by delivering shares of that underlying security to shareholders instead of cash. Mrs. Nguyen receives the in-kind distribution and keeps the securities in her brokerage account. Which of the following describes the immediate tax and cost-basis consequence for Mrs. Nguyen?", "choices": {"a": "She recognizes a taxable capital gain in the year of distribution equal to the fair market value of the securities received, and her cost basis in those securities equals that fair market value on the distribution date.", "b": "She defers tax until she sells the distributed securities, and her cost basis is the original cost basis the fund had in those securities.", "c": "The in-kind distribution is a tax-free return of capital that reduces her cost basis in her mutual fund shares but is not taxable until sale.", "d": "She recognizes ordinary income equal to the distribution amount, and the cost basis of the securities received is zero."}, "correct": "a", "rationale": "In-kind distributions are still taxable to shareholders: the distribution’s fair market value on the distribution date is taxable (capital gain if from gains), and that FMV becomes the shareholder’s cost basis in the received securities."}, {"num": 45, "question": "A start-up closed its first sale in a Rule 506 offering on May 1. The company asks you when it must file Form D with the SEC to comply with Regulation D timing requirements. Which is correct?", "choices": {"a": "Form D must be filed at least 30 days before the first sale.", "b": "Form D must be filed within 48 hours of first sale.", "c": "Form D should be filed only if requested by a state securities regulator.", "d": "Form D must be filed with the SEC within 15 days after the first sale."}, "correct": "d", "rationale": "For Reg D Rule 506 offerings, issuers must file Form D with the SEC within 15 days after the first sale. States often require their own notice filings and fees in addition to Form D."}, {"num": 46, "question": "An adviser is offered third-party marketing payments (undisclosed referral fees) by a mutual fund company for directing client assets into the fund. Which practice would most clearly violate the adviser’s fiduciary obligations?", "choices": {"a": "Accepting the payments without disclosing them to clients and without documenting that the fund is in clients’ best interests.", "b": "Disclosing the payments but continuing to recommend the fund because it is registered with the SEC.", "c": "Refusing the payments and continuing to recommend the fund when it is demonstrably best for the client.", "d": "Routing new client assets to the fund only for a trial period before switching to lower-cost alternatives."}, "correct": "a", "rationale": "Undisclosed third-party payments create a material conflict. Fiduciaries must disclose such compensation and ensure recommendations are in the client’s best interest; accepting undisclosed kickbacks is a breach of duty."}, {"num": 47, "question": "A 60-year-old retiree wants a fixed-income portfolio to provide regular income and maintain liquidity. She expects interest rates to rise modestly over the next 3-5 years and is concerned about capital losses on long bonds. Which portfolio strategy best meets her objectives?", "choices": {"a": "Bullet strategy: concentrate maturities around a single intermediate date to maximize yield at that point", "b": "Barbell strategy: hold a mix of short-term and long-term bonds to benefit from both ends of the curve", "c": "Laddering: stagger bond maturities evenly so principal is periodically returned for reinvestment", "d": "Full immunization: match the portfolio duration to a long-term target date regardless of cash-flow timing"}, "correct": "c", "rationale": "With expected rising rates and concern about price loss, laddering staggers maturities, returns principal regularly to be reinvested, and reduces exposure to long-term price declines."}, {"num": 48, "question": "A general partnership of three individuals requests a new investment account to trade partnership assets. Which documentation is MOST appropriate for the broker-dealer to obtain before opening the account?", "choices": {"a": "Articles of incorporation and corporate bylaws", "b": "A trust agreement naming the partnership as trustee", "c": "Partnership agreement and a listing of partners authorized to trade (or a partnership resolution)", "d": "Only personal identification for one partner"}, "correct": "c", "rationale": "Partnership accounts require the partnership agreement and documentation (or resolution) identifying which partners or officers are authorized to transact for the partnership; corporate documents are not applicable."}, {"num": 49, "question": "A firm discovers a stolen laptop containing unencrypted client Social Security numbers. Which of the following is the advisor’s most appropriate immediate response?", "choices": {"a": "Mail a breach notice to all clients immediately before investigating to limit liability", "b": "Contain the breach and activate the incident response plan (preserve evidence, assess scope), then notify regulators and affected clients as required", "c": "Post details of the breach on the firm’s website to demonstrate transparency", "d": "Permanently delete any server logs related to the laptop to protect client privacy"}, "correct": "b", "rationale": "Immediate steps are to contain and investigate the incident per the incident response plan, preserve evidence, and then make required notifications; premature public notice or deleting logs would be inappropriate."}, {"num": 50, "question": "A taxable client wants to limit trading costs and taxes while keeping the portfolio reasonably close to its strategic targets. Which rebalancing rule best balances those tradeoffs?", "choices": {"a": "Use tolerance (band) rebalancing (e.g., rebalance only when an asset class deviates more than ±15% from target) and use cash flows first to rebalance", "b": "Rebalance the portfolio on a strict monthly calendar schedule regardless of drift", "c": "Rebalance daily to keep allocations perfectly aligned with targets", "d": "Never rebalance to avoid triggering any taxable events"}, "correct": "a", "rationale": "Threshold (band) rebalancing combined with using contributions/withdrawals minimizes turnover and taxes while limiting drift; calendar rebalancing can cause unnecessary trades, and never rebalancing lets risk drift uncontrolled."}, {"num": 51, "question": "You manage several discretionary accounts and are preparing a firm brochure performance table to advertise the manager’s skill over the past five years. Several accounts had large client-driven cash inflows and outflows during that period. Which return should you use in the brochure to best reflect the manager’s investment performance independent of client cash flows?", "choices": {"a": "Time-weighted rate of return, because it eliminates the effect of external cash flows and isolates the manager’s investment performance.", "b": "Money-weighted (IRR) return, because it shows the actual client experience including cash flows.", "c": "Simple arithmetic average of yearly returns, because it best reflects average annual performance.", "d": "Dollar-weighted return, because it weights returns by portfolio size each period and emphasizes larger balances."}, "correct": "a", "rationale": "Time-weighted returns remove the impact of client cash flows and therefore are the appropriate measure for advertising a manager’s performance across multiple accounts."}, {"num": 52, "question": "Two portfolios are under consideration. Portfolio 1: expected return 12%, standard deviation 12%. Portfolio 2: expected return 11.5%, standard deviation 9%. Risk-free rate = 2%. Which portfolio has the higher Sharpe ratio (reward per unit of total risk)?", "choices": {"a": "Portfolio 2 has the higher Sharpe ratio because its excess return divided by a smaller SD is larger.", "b": "Portfolio 1 has the higher Sharpe ratio because it has the higher expected return.", "c": "Both portfolios have the same Sharpe ratio because their excess returns are similar.", "d": "Sharpe cannot be compared because the portfolios have different volatilities."}, "correct": "a", "rationale": "Sharpe1 = (12-2)/12 = 10/12 ≈ 0.833. Sharpe2 = (11.5-2)/9 = 9.5/9 ≈ 1.056. Portfolio 2 provides a higher return per unit of total risk."}, {"num": 53, "question": "A married couple wants to open a joint brokerage account and both want the surviving spouse to automatically receive full ownership of the assets if one spouse dies. Which account registration should the representative recommend?", "choices": {"a": "Joint tenants with right of survivorship (JTWROS)", "b": "Tenants in common", "c": "Tenancy by the entirety", "d": "Community property with right of survivorship"}, "correct": "a", "rationale": "JTWROS provides automatic survivorship so the surviving joint owner becomes sole owner; tenants in common does not provide survivorship. Tenancy by the entirety is only available in some states for married couples and differs from typical brokerage JTWROS; community property rules vary by state."}, {"num": 54, "question": "A commercial airline company wants to hedge its exposure to rising jet fuel costs for the next six months. The CFO is comparing futures contracts to call options on an oil-based futures contract. Which statement correctly contrasts the two instruments in the context of hedging?", "choices": {"a": "A futures contract creates an obligation for both buyer and seller at settlement, while buying a call option gives the airline the right but not the obligation to buy fuel at the strike price.", "b": "A call option obligates the buyer to purchase fuel at expiration, whereas a futures contract gives a one-sided right to buy fuel.", "c": "Both futures and options require the buyer to post a nonrefundable premium up front that reduces hedging cost.", "d": "Using futures provides insurance against price increases at the cost of an up-front premium similar to an option premium."}, "correct": "a", "rationale": "Futures create mutual obligations to transact at expiration (or settle), while an option buyer has a right (not an obligation) and pays a premium; futures do not require a premium like an option."}, {"num": 55, "question": "An investor is comparing two stocks: UtilityCo, a regulated utility that has paid a steady $4.00 per share annual dividend for many years and is expected to grow dividends at about 1% per year going forward; and GrowthTech, a rapidly expanding technology company that pays no dividends and reinvests all earnings to fund growth. Both companies have similar systematic risk. Which valuation approach is most appropriate for estimating the intrinsic value of each stock?", "choices": {"a": "Apply the Dividend Discount Model (DDM) to both UtilityCo and GrowthTech because discounting cash flows to equity is always preferred.", "b": "Use a P/E (earnings multiple) for UtilityCo and the DDM for GrowthTech because utilities are best valued by earnings multiples and growth companies by dividends.", "c": "Use the Dividend Discount Model for UtilityCo (stable dividend payer) and a P/E multiple or earnings-based valuation (or DCF on earnings) for GrowthTech (no dividends).", "d": "Use an asset‑based (liquidation) valuation for both firms because it provides the most conservative intrinsic value estimate."}, "correct": "c", "rationale": "DDM is appropriate for stable, dividend-paying firms (UtilityCo). For nondividend, high-growth firms (GrowthTech), valuation typically relies on earnings multiples (P/E) or discounted earnings/FCFE models; liquidation value and applying DDM to a non-payer are inappropriate."}, {"num": 56, "question": "Your firm backtested a new quant strategy and wants to include the backtested 5-year returns in a marketing piece. Which presentation would be compliant and transparent under advertising rules?", "choices": {"a": "Present the backtested returns as “historical performance” without additional comment, to show what the model achieved.", "b": "Show only the backtested peak year and describe it as typical performance to attract attention.", "c": "Clearly label the results as hypothetical/backtested, explain the methodology and assumptions, state that no client has experienced these returns, and disclose limitations and the absence of trading costs.", "d": "Mix the backtested results with a few real client accounts to make the performance look more credible without noting which are hypothetical."}, "correct": "c", "rationale": "Hypothetical or backtested performance must be clearly identified, accompanied by methodology, assumptions, limitations, and a statement that the results do not represent actual client trading."}, {"num": 57, "question": "An adviser recommends that a client move accounts to a third-party qualified custodian that is affiliated with the adviser’s parent company. Which of the following is the adviser’s responsibility after the custody change?", "choices": {"a": "Assume that the affiliated custodian’s statements are sufficient and stop sending account reports to clients.", "b": "Provide custody for client assets personally since the custodian is affiliated with the adviser.", "c": "Maintain physical possession of duplicate certificates at the adviser’s offices to satisfy custody documentation requirements.", "d": "Ensure the qualified custodian sends periodic account statements directly to the client and, if the adviser has custody (e.g., standing authority), arrange for required surprise examinations and maintain required records."}, "correct": "d", "rationale": "Even when a third-party qualified custodian holds assets, the custodian must send statements directly to clients; the adviser must still meet custody-rule obligations (records, disclosures, surprise exam if custody exists)."}, {"num": 58, "question": "Two portfolios each return 10% and the risk-free rate is 2%. Portfolio A: beta = 1.2, σ = 15%. Portfolio B: beta = 0.8, σ = 10%. Which portfolio would an investor who holds a well-diversified market portfolio (so only systematic risk matters) prefer based on reward per unit of systematic risk?", "choices": {"a": "Portfolio A, because it has the higher beta and therefore higher compensation for market risk.", "b": "Portfolio B, because its Treynor ratio (excess return divided by beta) is higher, giving better reward per unit of systematic risk.", "c": "They are equally attractive because both have the same expected return.", "d": "Neither; choice should be based solely on standard deviation when markets are well diversified."}, "correct": "b", "rationale": "Treynor = (Rp - Rf)/beta. Both have excess return 8%. TreynorA = 8/1.2 ≈ 6.67; TreynorB = 8/0.8 = 10. For an investor concerned only with systematic risk, Portfolio B is preferred."}, {"num": 59, "question": "A wealthy client expects to be subject to AMT and wants tax-exempt income that will not create AMT preference items. Which municipal security is the most appropriate recommendation?", "choices": {"a": "Private activity bond issued to finance a sports stadium leased to a private team.", "b": "Taxable municipal bond (Build America bond) that pays taxable interest but provides a federal subsidy.", "c": "Revenue bond for a small airport with substantial private concession contracts.", "d": "Essential-purpose general obligation bond issued to fund public school construction with no private use."}, "correct": "d", "rationale": "Essential-purpose general obligation bonds that fund public infrastructure (with no significant private use) are generally exempt from both regular federal tax and are not AMT preference items, making them suitable for clients subject to AMT."}, {"num": 60, "question": "During fact-finding you learn a 45-year-old client has limited discretionary cash flow and two near-term goals: fund a child’s college tuition in 5 years and retire at 65. Which of the following implementation priorities most appropriately reflects goals-based planning and tax-aware strategies?", "choices": {"a": "Fully fund a 529 plan first each year and ignore retirement plan contributions until the college fund is complete.", "b": "Continue contributing to tax-advantaged retirement accounts (e.g., 401(k), IRA) to preserve retirement savings and then allocate any remaining discretionary funds to a 529 for the 5-year college goal.", "c": "Put all discretionary funds into a taxable brokerage account for flexibility to pay either college or retirement needs later.", "d": "Purchase whole life insurance to cover both education and retirement goals because of lifetime guarantees."}, "correct": "b", "rationale": "When cash is limited, preserving retirement savings (with tax advantages and less opportunity to catch up) is typically prioritized. After maximizing retirement accounts, residual funds can be directed to a 529 for the shorter-term college goal."}, {"num": 61, "question": "A client holds a private equity fund that reports NAV quarterly and rarely has secondary market transactions. The client asks you to value that holding today for rebalancing purposes and to determine available liquidity. What is the most appropriate valuation approach for the adviser to use?", "choices": {"a": "Use the last transaction price reported by the fund’s administrator without adjustment because it is the most recent data point.", "b": "Treat the investment as cash-equivalent for liquidity planning since the client is high net worth.", "c": "Mark the position to a comparable public company multiple without considering differences in liquidity.", "d": "Estimate fair value by applying an appropriate valuation model and include a discount for lack of marketability and infrequent pricing when assessing liquidity and rebalancing impact."}, "correct": "d", "rationale": "Private equity holdings require fair-value estimates using models and should reflect discounts for lack of marketability and infrequent pricing when evaluating liquidity and portfolio rebalancing."}, {"num": 62, "question": "A participant takes a distribution from a company 401(k) and receives a check made payable directly to him (not to an IRA trustee). He intends to roll the money into an IRA. What is the best way to avoid mandatory federal income tax withholding and potential tax/penalty issues?", "choices": {"a": "Deposit the check into the IRA within 60 days; the 60-day rollover avoids withholding requirements.", "b": "Ask the plan administrator to issue a check to you and then forward it to the IRA; that eliminates withholding because the check was payable to you.", "c": "Deposit the net amount you received to an IRA and wait until tax time to claim the withheld amount as a credit.", "d": "Request a direct trustee-to-trustee (direct) rollover from the plan to the IRA to avoid the mandatory 20% federal withholding and potential rollover complications."}, "correct": "d", "rationale": "A direct (trustee‑to‑trustee) rollover avoids the mandatory 20% withholding required for distributions paid directly to the participant; an indirect 60‑day rollover is subject to withholding unless the participant replaces withheld funds from other sources."}, {"num": 63, "question": "An open-end fund holds a security listed on a foreign exchange that is closed for a national holiday. U.S. markets are open and there has been significant news affecting the issuer. Which valuation method is most appropriate for that security for today’s NAV?", "choices": {"a": "Use the prior day’s foreign exchange closing price without adjustment.", "b": "Use a fair value estimate that adjusts the prior market price to reflect current U.S. market information and news.", "c": "Use the fund’s cost basis in the security as a conservative estimate.", "d": "Exclude the security from NAV until the foreign exchange reopens."}, "correct": "b", "rationale": "When markets are closed but material information exists, mark-to-market is not reliable; the fund should use a fair value adjustment to reflect current events rather than stale prior prices or cost."}, {"num": 64, "question": "A 72-year-old client wants to ensure that all of his investment accounts and his primary residence avoid probate at death while retaining the ability to change beneficiaries and access assets during his lifetime. Which of the following strategies best meets his objectives?", "choices": {"a": "Create a revocable living trust, retitle accounts and real estate in the name of the trust, and keep the trust revocable so he can change its terms.", "b": "Transfer all assets into an irrevocable trust to remove them from his taxable estate and avoid probate.", "c": "Rely on joint tenancy with right of survivorship for each asset so the co-owner automatically inherits each item.", "d": "Use payable-on-death (POD) and transfer-on-death (TOD) designations for all accounts and property, and leave a will for any remaining assets."}, "correct": "a", "rationale": "A revocable living trust funded with the client’s assets allows him to retain access and make changes during life while avoiding probate at death; irrevocable trusts remove control, joint tenancy doesn’t cover all asset types, and POD/TOD may not address real estate or all assets."}, {"num": 65, "question": "An investor owns 18% of the outstanding shares of a corporation and wants to maximize the chance of electing at least one director to a five-member board at the next annual meeting. Which voting system would give the investor the best chance to elect a director with their 18% stake?", "choices": {"a": "Straight (statutory) voting, because each share gets one vote for each board seat and concentrates votes.", "b": "Proxy voting without restrictions, because it allows the investor to pool votes from other shareholders.", "c": "Cumulative voting, because it allows the investor to concentrate all votes on a single candidate to increase minority representation.", "d": "Class voting, because it limits voting to only certain classes and thereby increases influence of minority holders."}, "correct": "c", "rationale": "Cumulative voting lets a shareholder multiply shares by number of directors and allocate all votes to one candidate, helping minorities elect representation (unlike straight voting)."}, {"num": 66, "question": "A client owns 1,000 shares of a blue-chip stock that has been stable but may trade sideways in the near term. The client wants to generate current income from the position but is willing to limit upside beyond a modest amount. Which option strategy should the investment adviser recommend?", "choices": {"a": "Buy protective puts on the stock to insure against a decline while still collecting dividend income.", "b": "Sell covered calls against the stock to collect premium income while capping upside at the strike price.", "c": "Buy long calls to take advantage of any further appreciation while keeping downside exposure minimal.", "d": "Enter into futures contracts to lock in a sale price and receive immediate premium income."}, "correct": "b", "rationale": "A covered call generates immediate premium income from the long stock position but limits upside beyond the strike; a protective put protects downside (at a cost) rather than generating income."}, {"num": 67, "question": "An adviser shows both gross-of-fees and net-of-fees performance in a client report. A client asks why the net return is lower than the gross return. Which explanation best reconciles the two numbers?", "choices": {"a": "Gross returns account for market losses while net returns are adjusted upward for inflation.", "b": "Net-of-fees returns deduct advisory fees and other applicable fees/expenses from the gross returns, reflecting the actual return received by the client.", "c": "Gross returns include the effect of taxable distributions while net returns always exclude taxes.", "d": "Net returns are calculated using the arithmetic mean, which is always lower than the gross geometric return."}, "correct": "b", "rationale": "Net returns subtract advisory fees and other expenses from gross returns, so net-of-fees reflects the client’s actual received performance after costs."}, {"num": 68, "question": "A registered investment adviser is given a limited power of attorney by a client that expressly allows the adviser to withdraw cash from the client’s brokerage account to pay the client’s expenses. Under the Advisers Act custody rules, which of the following actions is the adviser required to take?", "choices": {"a": "Treat this as custody and engage an independent public accountant to perform an annual surprise examination of client assets.", "b": "No special custody procedures are required as long as the adviser keeps an internal log of withdrawals.", "c": "Forward all withdrawn funds to the client’s bank and no further action is necessary because withdrawals were client-authorized.", "d": "Register as a broker-dealer because withdrawal authority is a broker-dealer activity."}, "correct": "a", "rationale": "Possession of authority to withdraw client funds constitutes custody under the Advisers Act, which triggers requirements such as using a qualified custodian and arranging for an annual surprise examination by an independent public accountant."}, {"num": 69, "question": "An adviser pays a third-party solicitor a cash fee for referring clients. The solicitor gave referrals without providing any written disclosures to the prospective clients. Which of the following steps is required under the SEC’s cash solicitation rule (and good compliance practice)?", "choices": {"a": "Enter into a written solicitor agreement, ensure the solicitor provides a written disclosure to each prospective client describing the relationship and compensation, and retain records of the agreement and disclosures.", "b": "Continue paying the solicitor but report the arrangement only in the firm’s annual filing with the SEC; no c
