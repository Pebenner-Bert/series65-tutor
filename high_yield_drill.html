lient-level disclosures are necessary.", "c": "Stop payments to the solicitor immediately; payments for referrals are prohibited under federal rules.", "d": "Convert the cash payments to non-cash gifts (e.g., tickets) to avoid written disclosure requirements."}, "correct": "a", "rationale": "Rule 206(4)-3 requires a written solicitor agreement and that solicitors provide written disclosures about their relationship and compensation; the firm must keep related records."}, {"num": 70, "question": "An adviser discovers that a senior principal was recently convicted of a securities-related misdemeanor and failed to disclose this event on the firm’s Form ADV. What is the adviser’s compliance obligation regarding Form ADV amendments?", "choices": {"a": "Wait until the annual filing window and include the event in the next scheduled update.", "b": "Only disclose convictions on Form ADV Part 2; Part 1 need not be amended.", "c": "File a written explanation with the SEC but do not amend Form ADV unless there is a jail sentence.", "d": "Amend Form ADV promptly to reflect the disciplinary event (material change), and remember to keep annual updates within required timeframes."}, "correct": "d", "rationale": "Material changes, such as disciplinary events involving firm personnel, must be amended promptly on Form ADV rather than waiting for the annual update; annual amendments are also required within the specified post-fiscal-year timeframe."}, {"num": 71, "question": "A 68-year-old investor holds a highly appreciated concentrated stock position. He asks whether gifting the shares to his adult children during his lifetime or bequeathing them at death is better to minimize the capital gains tax burden for his heirs. Which is the most appropriate advisor response?", "choices": {"a": "Bequeathing the appreciated shares at your death generally provides your heirs a step-up in basis to fair market value at death, potentially eliminating capital gains on prior appreciation.", "b": "Gifting the shares during your lifetime gives your children a stepped-up basis equal to fair market value on the date of the gift.", "c": "Either gifting during life or bequeathing at death results in the same basis treatment for your children.", "d": "If you gift the shares during life, the estate will receive an automatic step-up in basis for tax purposes at your death."}, "correct": "a", "rationale": "Assets inherited at death generally receive a step-up in basis to their fair market value at the date of death; gifts during life transfer the donor’s basis (carryover basis), which can create capital gains for the donees."}, {"num": 72, "question": "A high-net-worth client with $5 million in investable assets says she wants to allocate 15% to a hedge fund that uses leverage and has a 3-year lock-up. She will need substantial liquidity in 18 months to fund a property purchase. Which advice is most appropriate?", "choices": {"a": "Proceed with the 15% allocation because her net worth indicates she can tolerate the illiquidity and leverage risk.", "b": "Recommend increasing allocation to 25% to benefit from possible higher returns from leverage.", "c": "Advise her to borrow against liquid securities to invest in the hedge fund so the property purchase won’t be affected.", "d": "Discourage the investment because the fund’s 3-year lock-up and leverage create a liquidity and risk mismatch with her 18-month funding need."}, "correct": "d", "rationale": "Suitability requires matching investment liquidity and risk to the client’s time horizon and cash needs; a 3-year lock-up and leveraged strategy are inconsistent with an 18-month liquidity requirement."}, {"num": 73, "question": "Your advisory firm has detected a pattern of large, rapid wire transfers that do not fit a client’s stated profile. Under a compliant AML program, which element is required to ensure the firm can identify and address such suspicious activity?", "choices": {"a": "Designation of an AML compliance officer, written policies and procedures, employee training, and independent testing of the program", "b": "Automatic freezing of any account with a wire transfer over $10,000 until cleared by a regulator", "c": "Mandatory client interviews by an outside law firm for any wire transfer above $5,000", "d": "Daily reporting of all wire transfers to state securities regulators"}, "correct": "a", "rationale": "A compliant AML program must include a designated AML officer, written policies and procedures, ongoing employee training, and independent testing — not automatic freezes, mandatory outside interviews, or daily state reporting."}, {"num": 74, "question": "A client in the 35% federal tax bracket is comparing a taxable corporate bond yielding 4.5% to a municipal bond yielding 3.0%. Which investment should the adviser recommend if the client’s objective is the highest after-tax yield, and why?", "choices": {"a": "Recommend the corporate bond because 4.5% is higher than 3.0% before taxes", "b": "Recommend the municipal bond because municipal interest is always preferable for high-bracket taxpayers regardless of yield", "c": "Recommend the municipal bond because its tax-equivalent yield (3.0% / (1 - 0.35) ≈ 4.62%) exceeds the taxable bond’s 4.5%", "d": "Recommend neither; the client should invest in equities instead to maximize after-tax returns"}, "correct": "c", "rationale": "Compare taxable equivalent yield: municipal yield / (1 − marginal tax rate) = 3.0% / 0.65 ≈ 4.62%, which is higher than the corporate bond’s 4.5%, so the muni provides a higher after-tax return for this taxpayer."}, {"num": 75, "question": "An advisory firm recently had client accounts moved from Custodian A to Custodian B, but the adviser retained standing authority to move funds from client accounts to pay client bills (bill-paying service). The firm does not physically hold client securities. Is the firm required to arrange a surprise examination by an independent public accountant?", "choices": {"a": "No — surprise exams are required only when the adviser has physical possession of securities.", "b": "No — as long as a qualified custodian holds the assets, the adviser is exempt from the surprise exam requirement.", "c": "Yes — but only if the adviser also signs client checks or takes possession of funds for more than 30 days.", "d": "Yes — retaining standing authority to withdraw client funds (bill-paying) constitutes custody and triggers the annual surprise examination requirement."}, "correct": "d", "rationale": "Rule 206(4)-2 treats standing authority to withdraw funds as custody; advisers with custody must engage an independent public accountant for an annual surprise examination, even when a qualified custodian holds the assets."}, {"num": 76, "question": "A client who meets the accredited investor threshold is considering a nontraded REIT that charges large upfront sales commissions, has high ongoing fees, and imposes a multi-year holding period before redemption windows open. Which of the following is the primary suitability concern you should discuss with the client?", "choices": {"a": "The REIT’s potential to generate taxable ordinary income rather than capital gains.", "b": "The investment’s limited liquidity combined with high upfront fees, which may make it unsuitable given the client’s need for flexibility.", "c": "The fact that accredited investors have fewer regulatory protections, so the adviser should obtain a waiver.", "d": "That the nontraded REIT will lower overall portfolio volatility due to real estate diversification."}, "correct": "b", "rationale": "Nontraded REITs are often illiquid and carry high upfront and ongoing fees; these factors are primary suitability concerns, even for accredited investors, particularly if the client needs flexibility."}, {"num": 77, "question": "A registered investment adviser is preparing the quarterly valuation for a registered open-end fund that holds 5% of its assets in a small-cap stock that has not traded on the exchange in six months. The fund’s pricing committee has no recent market quotations. Which valuation approach should the adviser use to determine the security’s contribution to the fund’s NAV?", "choices": {"a": "Use the last reported trade price from six months ago because it is the most recent market price.", "b": "Use the stock’s intrinsic value derived solely from a discounted cash flow prepared by the portfolio manager.", "c": "Use the cost the fund paid for the position, adjusted for any dividends received.", "d": "Apply a fair value estimate (independent quotes or valuation model) to mark the holding to fair value for NAV purposes."}, "correct": "d", "rationale": "When a market price is stale or unavailable, funds must use a fair value estimate (independent broker quotes or valuation models) rather than relying on an old last-sale price, cost, or a single manager’s intrinsic estimate."}, {"num": 78, "question": "A client is short 1,000 shares of XYZ and is worried about a sudden price spike that would produce large losses. The adviser proposes buying call options on XYZ as a hedge. What is the primary objective of this strategy?", "choices": {"a": "To increase the client’s short position using leverage and amplify potential gains from a decline.", "b": "To limit the potential loss on the short stock position by capping the maximum loss if the price rises above the call strike (net of the premium paid).", "c": "To generate immediate income to offset margin interest by collecting option premium.", "d": "To remove the need for margin on the short position entirely and eliminate any risk of assignment."}, "correct": "b", "rationale": "Buying calls when short stock turns unlimited loss potential into a limited loss (premium paid plus the ability to cover at the call strike if exercised); it is a hedging move to cap risk, not to generate income or remove margin requirements."}, {"num": 79, "question": "A client states during the initial interview that they have a high risk tolerance and want an aggressive portfolio. Objective analysis shows they are age 67, have low pension income, little other savings, and will need portfolio income within 5 years. As an adviser completing the IPS, what is the best course of action?", "choices": {"a": "Design the aggressive portfolio requested, documenting the client’s stated preference as the guiding factor under suitability.", "b": "Delay creating an IPS until the client completes a questionnaire confirming aggression and then follow their stated choices.", "c": "Discuss the discrepancy between stated risk tolerance and low risk capacity, educate the client, and document an allocation that reflects their near-term income needs and actual capacity.", "d": "Recommend speculative investments that could quickly increase savings to meet future income needs since the client prefers high risk."}, "correct": "c", "rationale": "Fiduciary duty requires assessing both subjective tolerance and objective capacity. If capacity is low (near-term withdrawals, little savings), advise and document a more conservative allocation aligned with ability to bear loss, not just stated preferences."}, {"num": 80, "question": "Mr. Alvarez receives an annual long-term capital gains distribution from a mutual fund and elects to have the distribution reinvested into additional shares of the same fund. Which of the following statements correctly describes the tax and cost-basis treatment of that reinvested distribution?", "choices": {"a": "The distribution is taxable in the year received even though reinvested; the reinvested amount establishes a new tax lot with a cost basis equal to the reinvested distribution amount and an acquisition date equal to the distribution date.", "b": "The distribution is not taxable until he sells the newly acquired shares; reinvestment defers the tax and the cost basis of reinvested shares is the original basis of his other holdings.", "c": "The reinvested distribution reduces his existing cost basis in older shares and is not itself a separate tax lot.", "d": "Reinvested capital gains distributions are treated as nontaxable returns of capital and only reduce future taxable gain on sale."}, "correct": "a", "rationale": "Reinvested capital gain distributions are taxable in the year distributed. The reinvested amount becomes a new tax lot with cost basis equal to the reinvested distribution and an acquisition date equal to the distribution date."}, {"num": 81, "question": "A married couple, ages 62 and 60, will retire in approximately 3 years. They have a conservative stated risk tolerance and plan to withdraw funds for living expenses starting at retirement. During the initial planning meeting you must recommend an implementation approach for the portion of the portfolio that will be needed in the next 3–5 years. Which of the following is the best recommendation?", "choices": {"a": "Maintain a long-term 80% equity allocation to maximize growth, then sell equities at retirement to fund withdrawals.", "b": "Shift entirely into a money market account to eliminate market risk for the near-term portfolio.", "c": "Buy high-yield corporate bonds to increase yield while accepting credit risk given the short time horizon.", "d": "Construct a short-duration bond ladder and hold cash equivalents for liquidity while keeping growth assets segregated for long-term needs."}, "correct": "d", "rationale": "For funds needed within 3–5 years, preserving capital and managing interest-rate risk is key. A short-duration ladder plus cash equivalents provides liquidity and reduces volatility; long-term equities are appropriate for funds not needed soon."}, {"num": 82, "question": "A client holds noncumulative preferred shares of XYZ Corp. The board omitted the preferred dividend for the last quarter and did not declare any dividends that quarter. If the board later declares a dividend that covers the current quarter only, which statement is true regarding payment?", "choices": {"a": "The missed preferred dividend from the earlier quarter must be paid before any dividend is paid to common shareholders.", "b": "The missed preferred dividend accumulates and will be paid out of the next dividend declared.", "c": "The missed preferred dividend converts into additional common shares at the board’s discretion before paying common shareholders.", "d": "Because the preferred is noncumulative, the missed dividend is forfeited and only the dividend for the declared quarter is paid (if declared)."}, "correct": "d", "rationale": "Noncumulative preferred shareholders do not have rights to missed dividends; only cumulative preferred accrue arrearages that must be paid before common dividends."}, {"num": 83, "question": "A stock just paid a $1.92 annual dividend. The company expects dividends to grow at 3% indefinitely. If an investor requires a 9% return, what is the stock’s value using the Gordon (constant growth) Dividend Discount Model? (Round to nearest cent.)", "choices": {"a": "$24.00", "b": "$32.00", "c": "$32.96", "d": "$36.00"}, "correct": "c", "rationale": "Gordon model uses D1/(r - g). D1 = 1.92*(1+0.03)=1.9776; value = 1.9776/(0.09-0.03)=1.9776/0.06 = 32.96 (rounded to nearest cent)."}, {"num": 84, "question": "An adviser receives higher trailing commissions when clients invest in the firm’s proprietary fund versus an external fund with similar performance and lower expense ratio. The adviser believes the proprietary fund is acceptable but not cost-advantaged. For the adviser to ethically recommend the proprietary fund, which action is required?", "choices": {"a": "Only verbal disclosure of the compensation difference during the sales discussion is necessary.", "b": "Full, written disclosure of the conflict plus a documented best-interests comparison showing why the proprietary fund is appropriate for that client (and obtaining informed consent) is required.", "c": "No disclosure is required because the adviser’s recommendations are covered by suitability rules, not fiduciary rules.", "d": "The adviser must never recommend a proprietary fund under any circumstances."}, "correct": "b", "rationale": "Advisers may recommend proprietary products but must fully disclose conflicts in writing, document that the recommendation is in the client’s best interest compared to alternatives, and obtain informed consent."}, {"num": 85, "question": "An advisor who is also the principal owner of a mutual fund family recommends one of those proprietary funds to a new client without explaining that the adviser earns higher trailer fees on the proprietary fund than on comparable outside funds. The client later learns of the additional fees. Which of the following best describes the adviser’s failure under fiduciary duty principles?", "choices": {"a": "The adviser complied with duty because the proprietary fund was objectively suitable for the client’s investment objective.", "b": "The adviser satisfied disclosure requirements by listing proprietary products on the firm’s website; no further action is required.", "c": "The adviser violated only securities registration rules, but there is no fiduciary breach if the fund performed in line with expectations.", "d": "The adviser failed to make full and fair disclosure of a material conflict and must disclose the conflict, obtain informed client consent, and document a best-interests analysis before recommending proprietary products."}, "correct": "d", "rationale": "Investment advisers owe a fiduciary duty to disclose material conflicts (including higher compensation for proprietary products). They must fully and fairly disclose the conflict, obtain informed consent, ensure the recommendation is in the client’s best interest, and document the analysis."}, {"num": 86, "question": "Two portfolios are constructed to immunize a 10-year liability; both have duration = 10 years and equal market value today. Portfolio X has higher convexity than Portfolio Y. If interest rates are expected to fall substantially (large change), which statement is correct?", "choices": {"a": "Portfolio Y will outperform because lower convexity reduces reinvestment risk", "b": "Both portfolios will perform identically because duration is matched", "c": "Portfolio X will produce a larger price gain and thus better fund the liability due to higher convexity", "d": "Neither portfolio should be used; immunization fails when rates move any amount"}, "correct": "c", "rationale": "With large rate moves, convexity matters: higher convexity increases price gains when yields fall, so Portfolio X will outperform despite equal duration."}, {"num": 87, "question": "An adviser wants to share client account details with an unaffiliated analytics vendor for marketing. Under Reg S-P, which action is required before sharing for new clients?", "choices": {"a": "No action is required for new clients if the data is pseudonymized", "b": "Obtain an affirmative written consent signed by the client before any sharing", "c": "Provide the initial privacy notice and allow the client a reasonable opt-out period (typically 30 days) before sharing", "d": "Share immediately but keep a copy of the privacy notice on file for one year"}, "correct": "c", "rationale": "Regulation S-P requires providing an initial privacy notice and giving clients a reasonable opt-out (commonly 30 days) before sharing nonpublic personal information with unaffiliated third parties for marketing."}, {"num": 88, "question": "A 58‑year‑old client plans to retire in 2 years, has a moderate risk tolerance, and the IPS specifies a strategic allocation of 40% equity / 60% fixed income with a 5% tolerance band. Their combined accounts (taxable and traditional IRA) have drifted to 55% equity / 45% fixed income after a strong equity rally. Which action most closely follows the IPS and is most appropriate given the client’s time horizon and tax considerations?", "choices": {"a": "Take advantage of the momentum and tactically increase the equity allocation to 60% to push for higher returns before retirement, then revert to the target after retirement.", "b": "Rebalance now back toward the 40%/60% strategic target, executing trades within the IRA first (to avoid realizing capital gains in the taxable account) and using tolerance‑band rules in the IPS rather than trying to time the market.", "c": "Delay any rebalancing until retirement to avoid transaction costs and potential short‑term market reversals; the client has only a small drift from the target.", "d": "Implement a calendar rebalancing rule and wait until the next scheduled quarterly rebalance to adjust allocations, since the market may continue to be volatile in the short term."}, "correct": "b", "rationale": "The client’s drift above the tolerance band increases risk inconsistent with the IPS and the near retirement horizon; rebalancing immediately is appropriate. To minimize tax impact, prefer to rebalance within tax-deferred accounts first and follow IPS tolerance-band rules rather than tactical timing or waiting until retirement."}, {"num": 89, "question": "A client complains that the return shown in his monthly statement is materially lower than the firm’s advertised composite return for the same period. The statement shows a -2.5% internal rate of return for his account while the firm’s composite shows +1.8% for the same timeframe. Assuming both calculations were done correctly, what is the most likely explanation?", "choices": {"a": "The firm used arithmetic mean returns for the composite, which always overstates true performance compared with client returns.", "b": "The firm probably miscalculated the composite return and should restate the brochure.", "c": "The client’s statement is incorrect because internal rates of return cannot be negative when the composite is positive.", "d": "The firm’s composite return is time-weighted (removing cash-flow effects), while the client’s return is money-weighted and was depressed by the timing/size of his withdrawals."}, "correct": "d", "rationale": "A time-weighted composite removes client cash-flow effects; a client’s money-weighted (IRR) return incorporates large withdrawals or contributions and can differ substantially."}, {"num": 90, "question": "An adviser prepares quarterly statements for a client with a significant private placement equity holding. The last financing round was nine months ago and there have been no subsequent transactions. For the current quarter’s valuation, the adviser should most appropriately:", "choices": {"a": "Report the position at the original cost basis until a new financing or sale occurs.", "b": "Estimate fair value using a valuation technique that incorporates the last financing, changes in the company’s fundamentals, and a discount for lack of marketability.", "c": "Use the prior quarter’s reported value without adjustment because there is no new transaction data.", "d": "Apply the NAV of a comparable public company without any discount."}, "correct": "b", "rationale": "Private investments require fair-value estimates based on valuation techniques that consider recent financings plus adjustments for changes in fundamentals and discounts for illiquidity/marketability, not simply cost or stale values."}, {"num": 91, "question": "A 35-year-old investor has a specific 2-year savings goal and wants to invest $10,000 in a mutual fund but is adamant about avoiding any front-end sales charge. Which share class is most appropriate for this client?", "choices": {"a": "Class A shares with a front-end load but lower ongoing expenses", "b": "Class B shares that impose a contingent deferred sales charge but convert to A shares after several years", "c": "Class C shares that generally have no front-end load and are designed for shorter holding periods", "d": "Institutional shares, which always have the lowest expense ratio and no sales charges"}, "correct": "c", "rationale": "Class C shares typically have no front-end load (they carry level or short-term CDSCs and higher ongoing fees), making them better for investors with short time horizons who want to avoid an upfront sales charge."}, {"num": 92, "question": "You are advising a founder planning a private placement to raise $8 million under Rule 506(b) of Regulation D. The issuer intends to sell to 40 investors, including 10 non-accredited but sophisticated purchasers, across five states. Which of the following statements is correct regarding federal and state filing obligations?", "choices": {"a": "The offering is exempt from SEC registration under Rule 506(b), but the issuer must file Form D with the SEC and may need to make notice filings (and pay state fees) in each state where the securities are offered.", "b": "Because the offering includes non-accredited investors, the federal exemption is lost and the securities must be registered with the SEC.", "c": "Once Form D is filed with the SEC, no further filing or fees are required at the state level in any state where the securities are sold.", "d": "Rule 506(b) requires registration in every state where an investor resides, regardless of the number of non-accredited investors."}, "correct": "a", "rationale": "Rule 506(b) is a federal exemption (allows up to 35 non-accredited sophisticated investors). Issuers must file Form D with the SEC and states may require separate notice filings and fees—states cannot impose additional substantive requirements for Rule 506 offerings."}, {"num": 93, "question": "A married couple files jointly. Only the husband has earned income of $80,000; the wife is a homemaker with no earned income. Both spouses are under age 50 and want to save for retirement. Which statement about IRA contributions is correct?", "choices": {"a": "Only the husband may contribute to an IRA because the wife has no earned income.", "b": "The couple may contribute a combined amount equal to their earned income into a single joint IRA.", "c": "Each spouse may contribute up to the annual IRA limit to his or her own IRA, provided the couple’s combined earned income is at least equal to the total contributions.", "d": "The wife may contribute only if she has investment income or the husband transfers wages to her account."}, "correct": "c", "rationale": "Spousal IRAs allow a nonworking spouse to have an IRA funded from the working spouse’s earned income; each spouse can contribute up to the annual limit to separate IRAs as long as combined earned income covers the contributions."}, {"num": 94, "question": "A 45-year-old client has $10,000 to invest in a taxable account and plans to contribute $500 monthly via an automatic investment plan. The client wants broad-market equity exposure, low ongoing costs, and prefers to avoid frequent transaction fees. Which choice is the most suitable?", "choices": {"a": "Purchase shares of a broad-market ETF through the client’s brokerage account because ETFs have the lowest expense ratios and superior tax efficiency.", "b": "Invest in a no-load, low–expense-ratio index mutual fund (no 12b-1 fee) that accepts automatic monthly investments, avoiding transaction costs and bid/ask spreads.", "c": "Buy Class A shares of an actively managed mutual fund to take advantage of breakpoint discounts on future contributions.", "d": "Select Class C shares of a no-load fund to avoid front-end charges and provide flexibility for short-term trading."}, "correct": "b", "rationale": "For a client making small, regular contributions who wants to avoid transaction fees, a no-load index mutual fund that accepts automatic investments is best: it avoids per-trade brokerage commissions and bid/ask spreads associated with ETFs. ETFs are tax-efficient but can incur transaction costs for frequent small purchases. Class A funds have front-end loads (unless breakpoint applies) and Class C shares carry higher ongoing 12b-1/expense fees, making them poor choices for long-term, regular investing."}, {"num": 95, "question": "A corporate bond pays an 8% coupon, matures in 30 years at par $1,000, and is callable in 5 years at 102. If market yields fall from 6% to 4%, which outcome is most likely for an investor who purchased the bond before yields fell?", "choices": {"a": "The bond’s price will rise well above the 102 call price and it is unlikely to be called, so the investor will earn the higher YTM.", "b": "The bond will continue trading at a large discount because investors will prefer new issues at lower yields.", "c": "The bond’s price will fall and the investor will realize a loss because callable bonds always underperform when yields decline.", "d": "The bond’s market price will approach the call price and, if called, the investor’s realized return will be closer to the yield-to-call than the yield-to-maturity."}, "correct": "d", "rationale": "When yields fall, callable bonds often rise toward the call price because issuers can refinance. If called, the investor’s realized return is the yield-to-call (typically lower than YTM when selling at a premium)."}, {"num": 96, "question": "A client instructs you to buy 1,000 shares of XYZ stock immediately but refuses to pay more than $50.25 per share. The current quoted offer is $50.10 and the bid is $50.00. Which order type best satisfies the client’s requirement for immediate execution while respecting the price cap?", "choices": {"a": "Enter a market order to buy 1,000 shares so it executes immediately at the best available price", "b": "Enter a traditional limit buy order at $50.25 and let it sit on the book until filled", "c": "Enter a sell stop order at $50.25 that will trigger when the market hits that level", "d": "Enter a marketable limit buy order with a limit of $50.25 so it will execute immediately up to that cap"}, "correct": "d", "rationale": "A marketable limit order sets a maximum price the client will pay but is immediately executable against displayed liquidity (the ask). A plain market order would have no price cap; a plain limit order might not be marketable if placed away from the current ask; a stop order is not appropriate for an immediate buy-limited execution."}, {"num": 97, "question": "An investor forms two equally weighted two-asset portfolios. In Portfolio A, the two assets each have σ = 20% and the correlation between them is 0. In Portfolio B, the two assets each have σ = 20% and the correlation is 0.8. Which portfolio provides the greater diversification benefit (i.e., lower overall portfolio standard deviation)?", "choices": {"a": "Portfolio A, because zero correlation lowers the portfolio variance more than a high positive correlation does.", "b": "Portfolio B, because higher correlation improves risk reduction through covariance offsets.", "c": "Both provide identical diversification benefit because the individual asset volatilities are the same.", "d": "Neither provides diversification benefit because the assets have identical standard deviations."}, "correct": "a", "rationale": "With equal weights σp^2 = .25σ1^2 + .25σ2^2 + .5σ1σ2ρ. If σ=20%: with ρ=0, σp ≈ 14.14%; with ρ=0.8, σp ≈ 19%. Lower correlation gives much greater diversification benefit."}, {"num": 98, "question": "A 62-year-old client who needs steady monthly income and may need to access capital on short notice tells you she wants to invest in a real estate vehicle recommended by a friend. The friend suggested a REIT that is not listed on any exchange (a nontraded REIT). Which recommendation best fits the client’s liquidity needs?", "choices": {"a": "Recommend the nontraded REIT because it typically pays higher yield than publicly traded REITs and meets her income objective.", "b": "Recommend a private equity real estate fund because it provides stable income and long-term capital appreciation.", "c": "Recommend a hedge fund that invests in real estate securities because hedge funds offer monthly liquidity.", "d": "Recommend a publicly traded REIT for income because it provides similar exposure with daily liquidity and price transparency."}, "correct": "d", "rationale": "Nontraded REITs and private equity funds are typically illiquid and have long hold periods; publicly traded REITs trade on exchanges and provide the liquidity and transparency appropriate for a client who may need cash on short notice."}, {"num": 99, "question": "A client mails original stock certificates to her investment adviser for “safe-keeping” without telling the qualified custodian. The adviser receives the certificates and places them in the adviser’s office vault. Under custody rules, what must the adviser do to correct this situation?", "choices": {"a": "Promptly deliver the securities to a qualified custodian, notify the client in writing that the securities were received and moved, and take any other steps required by the custody rule (e.g., arrange for surprise exam if custody persists).", "b": "Hold the certificates in the adviser’s vault indefinitely as a safekeeping agent because the client requested it in writing.", "c": "Deposit the certificates into the adviser’s general business account so they are insured by the firm’s insurance policy.", "d": "Return the certificates to the client immediately and refuse to accept any future physical deliveries to avoid custody obligations."}, "correct": "a", "rationale": "If an adviser receives client securities, they must be transferred promptly to a qualified custodian and the client should be notified; otherwise the possession creates custody and triggers custody-rule requirements (surprise exam, disclosures, etc.)."}, {"num": 100, "question": "An investor placed a sell stop order at $40 on 200 shares of ABC, with the market last trading at $42. Overnight news causes the stock to gap down and the opening print the next day is $38.50. What is the most likely outcome for the client’s sell stop order?", "choices": {"a": "The stop will not be triggered because the last price closed above $40", "b": "The stop will be converted into a sell limit order at $40 and will not execute below $40", "c": "The stop will be triggered and convert into a market order, and the order may be executed at prices below $40 (e.g., $38.50)", "d": "The stop will be adjusted down to the opening price of $38.50 and then executed at $40"}, "correct": "c", "rationale": "A sell stop order becomes a market order when the stop price is hit; if the market gaps below the stop, execution can occur at the next available price which may be below the stop level."}, {"num": 101, "question": "A client in the 28% federal bracket is comparing a 3.6% tax-exempt municipal bond to a 5.0% corporate bond. Which statement is correct?", "choices": {"a": "The corporate bond is a better after-tax investment because 5.0% > 3.6%.", "b": "The municipal bond is always preferable because municipal interest is tax-exempt.", "c": "The tax-equivalent yield of the municipal (3.6% ÷ (1 − 0.28) = 5.0%) equals the corporate bond, so they are economically equivalent at this marginal rate.", "d": "The municipal bond is preferable only if it is insured by a bond insurer."}, "correct": "c", "rationale": "Calculate TEY: 3.6% / 0.72 = 5.0%. At a 28% federal rate, the muni’s tax-equivalent yield equals the 5.0% corporate yield, making them economically equivalent for this client (ignoring state taxes and credit risk)."}, {"num": 102, "question": "Mr. Lin purchased Class B shares of a mutual fund 7 years ago. He calls and asks whether those shares can be converted and what the tax/sales-charge consequence will be. Which of the following statements best describes a typical industry practice regarding conversion privileges for Class B shares after the CDSC schedule has expired?", "choices": {"a": "Class B shares commonly convert to Class A shares after the deferred sales charge period expires, eliminating future CDSC on redemptions.", "b": "Class B shares automatically convert to no-load shares, producing an immediate taxable event equal to the fund’s undistributed capital gains.", "c": "Conversion of Class B to Class A requires payment of the original front-end sales load at the time of conversion.", "d": "Class B shares cannot be converted; the shareholder must redeem and repurchase Class A shares if desired."}, "correct": "a", "rationale": "Many fund complexes convert Class B shares to Class A after the deferred sales-charge period to stop ongoing 12b-1 fees and future CDSCs; conversion itself is not a taxable event and does not require paying a front-end load."}, {"num": 103, "question": "An investor holds three tax lots of the same mutual fund: Lot A purchased in 2016, Lot B purchased in 2021, and Lot C purchased with a reinvested capital gains distribution in 2024. In 2026 she instructs her broker to sell 100 shares but does not specify a tax-lot identification method. Which of the following statements about how the shares will be selected for sale is correct?", "choices": {"a": "The broker will automatically sell the shares from the most recent lot (Lot C) first to minimize capital gains unless instructed otherwise.", "b": "If the investor does not specify, the broker generally uses FIFO and the oldest shares (Lot A) will be sold first.", "c": "The reinvested distribution lot (Lot C) is always sold last and cannot be selected without prior written instruction.", "d": "The IRS requires brokers to select the lot with the highest cost basis by default to minimize taxes."}, "correct": "b", "rationale": "Unless the investor specifies a tax-lot method (specific identification, LIFO, etc.), the default for mutual fund share sales is generally FIFO (first in, first out), so the oldest lot is sold first."}, {"num": 104, "question": "A 28-year-old investor with no near-term liquidity needs, a 40+ year horizon, and a high tolerance for volatility asks for a recommended strategic allocation. Which allocation best fits an aggressive growth profile?", "choices": {"a": "90% equities (broad US and international mix, including small-cap and emerging markets), 10% fixed income/cash", "b": "60% equities, 40% investment-grade bonds", "c": "40% equities, 60% bonds and cash equivalents", "d": "20% equities, 80% high-quality bonds"}, "correct": "a", "rationale": "An aggressive growth profile favors a very high equity allocation to capture long-term capital appreciation; 90% equities with a small fixed income sleeve suits a young investor with high risk tolerance and long horizon."}, {"num": 105, "question": "A corporation announces a 2-for-1 forward stock split. Which of the following changes will occur immediately after the split?", "choices": {"a": "The number of shares outstanding doubles and the par value per share is halved; the firm’s total market capitalization remains essentially unchanged.", "b": "Earnings per share (EPS) and the company’s market capitalization both double.", "c": "Shareholders’ proportional ownership percentages change, and preferred shareholders’ par value per share is unaffected.", "d": "The company’s retained earnings account is decreased to reflect the increased number of shares."}, "correct": "a", "rationale": "A forward split increases shares and reduces par value per share proportionally; market cap and ownership percentages remain the same. EPS is diluted proportionally but net income unchanged."}, {"num": 106, "question": "A mutual fund’s accounting shows marketable securities valued at $900,000, an illiquid private position the board has fair-valued at $50,000, cash of $10,000, and accrued expenses of $5,000. The fund has 40,000 shares outstanding. What NAV per share should the fund report?", "choices": {"a": "$23.88 per share", "b": "$22.50 per share", "c": "$24.00 per share", "d": "$21.25 per share"}, "correct": "a", "rationale": "NAV = (Assets − Liabilities) / Shares. Total assets = 900,000 + 50,000 + 10,000 = 960,000; minus liabilities 5,000 = 955,000; divide by 40,000 = $23.875 → $23.88."}, {"num": 107, "question": "An adviser plans to advertise a 10% annualized gross return for a model strategy without showing any net-of-fees figures. Which statement about that ad would make it compliant with performance presentation rules?", "choices": {"a": "The ad must clearly state the returns are gross of advisory fees and include a net-of-fees return calculated using the highest model advisory fee the client might pay (or the actual fee schedule) so readers understand the effect of fees.", "b": "No additional disclosure is required as long as the word “gross” appears anywhere in the ad.", "c": "The adviser should only disclose client-specific fees, not a model fee, to avoid confusing prospective clients.", "d": "The adviser can omit net returns if the ad already lists examples of typical trades to demonstrate strategy implementation."}, "correct": "a", "rationale": "Presenting gross returns without disclosing the effect of advisory fees is misleading; regulations require clear disclosure and a net-of-fees counterpart (or disclosure of the fee used)."}, {"num": 108, "question": "A corporation wants to open a brokerage account to trade on behalf of the business. Which set of documents is the broker-dealer most likely required to obtain before opening the account?", "choices": {"a": "Only the corporate bylaws", "b": "Only a copy of the minutes from the most recent board meeting", "c": "Only the personal guarantees of the officers", "d": "Articles of incorporation and a corporate resolution authorizing the account and designated signers"}, "correct": "d", "rationale": "For corporate accounts firms typically require the articles of incorporation (or charter) to verify existence and a corporate resolution (or board minutes) authorizing the account and naming persons who may trade/sign."}, {"num": 109, "question": "Sam runs an investment management practice that provides advice only to his immediate family (parents, siblings) and entities wholly owned and controlled by family members. He does not solicit or advise any outside clients and holds himself out only to family members. Under the Investment Advisers Act of 1940, what is Sam’s regulatory status?", "choices": {"a": "He must register with the SEC because he provides investment advice for compensation.", "b": "He must register as a state-registered investment adviser in the state where he has an office.", "c": "He is required to file Form ADV but is exempt from examination by the SEC.", "d": "He is excluded from the definition of “investment adviser” as a family office and is not required to register under the Advisers Act."}, "correct": "d", "rationale": "Family offices that provide investment advice only to family clients and meet the SEC’s family office rule are excluded from the definition of investment adviser and are not required to register under the Advisers Act."}, {"num": 110, "question": "A high-net-worth client wants life insurance proceeds to be available to pay estate taxes but not be includable in his taxable estate at death. Which plan best accomplishes this objective?", "choices": {"a": "Keep the policy in the client’s name and name an ILIT (inter vivos trust) as the beneficiary.", "b": "Name the client’s revocable living trust as beneficiary so proceeds won’t be included in his estate.", "c": "Name the client’s spouse as beneficiary and rely on the marital deduction to remove the proceeds from the estate.", "d": "Have an irrevocable life insurance trust (ILIT) own the policy (or have the client transfer ownership to the ILIT more than three years before death) so proceeds are excluded from the client’s estate."}, "correct": "d", "rationale": "To exclude life insurance proceeds from the insured’s estate, the policy must be owned by an ILIT and not by the insured at death; transfers to the insured’s trust within three years of death may be pulled back into the estate under the three-year lookback rule."}, {"num": 111, "question": "You are supervising trade execution for a client who requires both a specific minimum block size (to avoid price impact) and the best available price. The order can be routed to several venues. Under the broker’s/adviser’s best execution obligation, what should you do?", "choices": {"a": "Always route to the venue with the lowest displayed price regardless of whether it can handle the client’s block size", "b": "Select the venue or execution strategy that reasonably balances price, speed and likelihood of execution given the client’s size constraint", "c": "Split the order across all venues equally to show best effort, regardless of venue capacity", "d": "Fill the order internally at your firm’s inventory price to guarantee immediate execution"}, "correct": "b", "rationale": "Best execution requires considering price, speed, and the likelihood of execution or settlement in light of client constraints (e.g., minimum block size). Routing only by displayed price or internalizing without regard to the client’s size could violate best execution."}, {"num": 112, "question": "An adviser executes an equity trade for a client on Friday at 11:00 a.m. Under a T+1 settlement regime, when is the trade scheduled to settle (assuming no holidays)?", "choices": {"a": "Friday (same day) because the trade was executed before noon", "b": "Saturday, because T+1 counts calendar days", "c": "Sunday, because settlement is counted from trade date plus one day", "d": "Monday (the next business day), because T+1 settles one business day after trade date"}, "correct": "d", "rationale": "T+1 means settlement occurs one business day after the trade date. Weekends and holidays are not business days, so a Friday trade settles on the following Monday (unless Monday is a holiday)."}, {"num": 113, "question": "An investment adviser representative (IAR) is given a standing limited power of attorney by a client that authorizes the IAR to instruct the client’s broker-dealer to transfer advisory fees from the client’s brokerage account to the adviser’s bank account each quarter. The broker-dealer continues to hold the client’s assets. Under the custody rule, does the IAR’s standing limited power of attorney constitute custody?", "choices": {"a": "No — custody exists only when the adviser physically holds client funds or securities, so the broker-dealer’s custody prevents adviser custody.", "b": "Yes — the authority to withdraw client funds (standing authorization to move advisory fees) is considered custody even if a qualified custodian holds the assets.", "c": "No — because the broker-dealer is a qualified custodian and the adviser cannot physically access the assets, the adviser does not have custody.", "d": "Yes — but only if the adviser also has the ability to transfer securities; fee-withdrawal authority alone is not custody."}, "correct": "b", "rationale": "A standing limited POA that permits an adviser to withdraw funds to pay fees counts as custody under Rule 206(4)-2 because the adviser has authority to withdraw client funds, even though a qualified custodian holds the assets."}, {"num": 114, "question": "An investment adviser uses an introducing broker-dealer to execute client trades and routes all executed trades to a separate clearing (carrying) broker-dealer for settlement and custody. Who is primarily responsible for the physical settlement and safekeeping (custody) of the securities and cash?", "choices": {"a": "The clearing (carrying) broker-dealer that holds the securities and cash and handles settlement", "b": "The introducing broker-dealer that received the order from the adviser", "c": "The investment adviser, which placed the trade on behalf of the client", "d": "The executing exchange where the trade occurred"}, "correct": "a", "rationale": "In an introducing/clearing relationship, the clearing (carrying) broker-dealer is responsible for clearing, settlement and custody of the securities and cash, while the introducing firm handles client contact and order flow."}, {"num": 115, "question": "A prospective client opens an account and the firm intends to share nonpublic personal information with unaffiliated marketing vendors. According to Regulation S-P, what must the adviser provide at account opening?", "choices": {"a": "An initial privacy notice describing information-sharing practices and an opt-out mechanism before sharing with unaffiliated third parties", "b": "A signed written waiver from the client authorizing any future disclosure of personal information", "c": "A standard disclosure only if the client specifically requests it in writing", "d": "No notice is required so long as data is encrypted during transfer"}, "correct": "a", "rationale": "Regulation S-P requires delivery of an initial privacy notice at account opening that explains information-sharing practices and provides an opt-out option for sharing with unaffiliated third parties."}, {"num": 116, "question": "A 67-year-old retiree with a moderate risk tolerance needs an IPS to manage a portfolio that funds monthly income and preserves capital. Which element is MOST important to include in the IPS to prevent strategy drift and ensure the portfolio continues to meet income needs over time?", "choices": {"a": "A fixed list of approved individual securities to be held permanently in the portfolio", "b": "A single performance benchmark that all investments must beat each quarter", "c": "A strategic target asset allocation with allowable ranges for each asset class and a rebalancing policy", "d": "A promise to limit advisory fees to a specific percentage of assets regardless of services provided"}, "correct": "c", "rationale": "An IPS should set a strategic target allocation with allowable ranges and a rebalancing policy so the portfolio maintains the risk/return profile needed for income and capital preservation; a fixed list of securities or a rigid performance requirement doesn’t manage drift or liquidity needs."}, {"num": 117, "question": "An advisor believes market interest rates will fall significantly over the next two years. The client wants to preserve liquidity but also capture price appreciation if yields decline. Which fixed-income structure is most appropriate?", "choices": {"a": "Barbell: combine short-term bonds for liquidity with long-term bonds to capture price gains if yields fall", "b": "Laddering: evenly stagger maturities to reduce reinvestment risk", "c": "Bullet: concentrate all maturities at the same intermediate date to maximize yield at that date", "d": "Immunization: match duration to the investment horizon to eliminate reinvestment risk"}, "correct": "a", "rationale": "A barbell provides short-term liquidity while holding long bonds that will appreciate if rates fall, fitting a view of declining yields and desire for some liquidity."}, {"num": 118, "question": "During a routine examination, an SEC examiner requests copies of all client-related correspondence (including emails) going back four years. The RIA’s written retention policy currently keeps correspondence for only two years. Under SEC recordkeeping rules, what retention requirement applies?", "choices": {"a": "Keep correspondence for one year; anything older can be discarded.", "b": "Retain correspondence for 10 years and provide the older records immediately.", "c": "Retain correspondence for five years, with the first two years in an easily accessible place, so the examiner’s request for four years of records must be fulfilled.", "d": "No specific requirement exists; retention periods are at the firm’s discretion."}, "correct": "c", "rationale": "SEC rules require most adviser books and records (including correspondence) to be retained for five years, with the first two years kept in an easily accessible location; examiners can thus request records within that period."}, {"num": 119, "question": "A senior adviser is offered an all‑expenses‑paid weekend trip by the manager of a private fund the firm is considering recommending to clients. The trip is valued at $1,800 and is clearly intended to influence the adviser. What is the most appropriate immediate action under common codes of ethics and supervisory rules?", "choices": {"a": "Accept the trip but disclose the receipt to clients at the next quarterly review since the adviser believes it will not affect recommendations.", "b": "Accept the trip and pay the manager market value for the trip after returning to eliminate the appearance of influence.", "c": "Decline or return the trip, notify the firm’s compliance officer, document the incident, and follow the firm’s policy for vendor gifts and potential conflicts before any recommendation is made.", "d": "Accept the trip and reassign the manager’s fund recommendations to a different adviser in the firm to avoid a conflict."}, "correct": "c", "rationale": "High-value gifts that could influence recommendations should be refused or returned and reported to compliance; disclosure alone is not sufficient to cure the conflict."}, {"num": 120, "question": "A high-income client who is likely to be subject to the Alternative Minimum Tax (AMT) asks which municipal bond interest is most likely to be treated as a tax preference item and therefore included when calculating AMT. Which bond should you warn them about?", "choices": {"a": "General obligation bond issued to finance local road maintenance.", "b": "Private activity municipal bond issued to finance a privately used facility.", "c": "Revenue bond issued by a public water utility with no private use.", "d": "U.S. Treasury note (interest is taxable federally but generally exempt from state and local tax)."}, "correct": "b", "rationale": "Interest on many private activity bonds is a tax preference item for AMT purposes, so it may be includable in alternative minimum taxable income even though it’s exempt for regular federal income tax."}, {"num": 121, "question": "During an initial fact-finding interview a 32-year-old client reports a high willingness to accept investment risk and a desire for capital appreciation. However, the client also discloses only $2,000 in liquid savings, monthly net income just covering living expenses, and a 6-month upcoming planned home renovation requiring $25,000 in cash. As their adviser creating an IPS, which of the following is the most appropriate immediate recommendation?", "choices": {"a": "Allocate to a high-growth equity portfolio to match the client’s stated willingness to accept risk and plan to withdraw funds when needed for the renovation.", "b": "Prioritize building a liquid emergency/renovation fund and use a conservative short-term allocation for those near-term needs, while setting a long-term growth allocation for remaining assets.", "c": "Purchase long-duration, high-yield bonds to generate income for the renovation and hold equities for long-term growth.", "d": "Recommend fully funding retirement accounts first and defer establishing a renovation fund given the client’s long investment horizon."}, "correct": "b", "rationale": "Although the client states high risk tolerance, their low liquidity and a sizable short-term cash need reduce risk capacity. The fiduciary duty is to recommend realistic steps: establish a liquid fund for near-term goals using conservative investments, while allocating remaining assets for long-term growth."}, {"num": 122, "question": "A single investor is evaluating whether she meets the accredited investor net-worth test to participate in a Reg D private placement. Her balance sheet shows total assets of $1.05 million, which includes $250,000 of equity in her primary residence. Which statement correctly describes her status?", "choices": {"a": "She qualifies as an accredited investor because her total net worth exceeds $1,000,000, regardless of asset composition.", "b": "She does not qualify as an accredited investor because the equity in her primary residence must be excluded when determining net worth, leaving her below $1,000,000.", "c": "She can qualify if she signs a declaration that the residence will not be sold within a APM-expected return while Y’s does not."}, "correct": "d", "rationale": "CAPM expected = rf + beta(rm - rf) = 2% + beta(8%). X: 2 + 1.28 = 11.6% → alpha = 12 - 11.6 = +0.4%. Y: 2 + 1.58 = 14% → alpha = 13 - 14 = -1%. X’s alpha is higher."}, {"num": 125, "question": "A client has $350,000 of marketable securities held in a brokerage account and $300,000 of cash that the broker swept into a single bank deposit program. If the broker-dealer fails and the sweep bank also fails, which statement about protection of the client’s assets is correct?", "choices": {"a": "All $650,000 would be covered by SIPC because SIPC protects both securities and bank deposits held through a broker up to $500,000.", "b": "The entire $300,000 cash sweep would be insured by FDIC because sweep accounts are treated as bank deposits and FDIC covers broker-related deposits fully.", "c": "The securities ($350,000) would be protected up to SIPC limits and the bank sweep cash would be FDIC-insured up to $250,000; $50,000 of the cash sweep would be uninsured.", "d": "SIPC would cover the $300,000 cash sweep and FDIC would cover the $350,000 securities because of cross-coverage between SIPC and FDIC."}, "correct": "c", "rationale": "SIPC protects customer securities (and limited cash in a failed broker) up to $500,000 (including $250,000 cash); cash swept into a bank is FDIC-insured up to $250,000 per depositor per bank — here $300k sweep leaves $50k uninsured."}];

/* ────────────────────────────────────────────────────────────
   STATE
   ──────────────────────────────────────────────────────────── */
let shuffleMode = false;
let queue       = [];   // ordered array of question indices into DRILL_QUESTIONS
let qIndex      = 0;    // position in queue
let answered    = false;
let score       = { correct: 0, wrong: 0, skipped: 0 };
let skippedSet  = new Set();   // indices of skipped questions

function buildQueue() {
  queue = DRILL_QUESTIONS.map((_, i) => i);
  if (shuffleMode) shuffleArray(queue);
  qIndex   = 0;
  answered = false;
  score    = { correct: 0, wrong: 0, skipped: 0 };
  skippedSet.clear();
}

function shuffleArray(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
}

/* ────────────────────────────────────────────────────────────
   RENDER
   ──────────────────────────────────────────────────────────── */
function renderQuestion() {
  const card  = document.getElementById('q-card');
  const qData = DRILL_QUESTIONS[queue[qIndex]];

  card.className = '';
  answered = false;

  // Meta
  const isSkipped = skippedSet.has(queue[qIndex]);
  document.getElementById('q-num-badge').textContent = 'Q' + qData.num;
  document.getElementById('q-meta-text').innerHTML   =
    (isSkipped ? '<span class="skipped-badge">Previously Skipped</span> ' : '') +
    'Question ' + qData.num + ' of 125';

  // Question text
  document.getElementById('q-text').textContent = qData.question;

  // Choices
  const choicesEl = document.getElementById('q-choices');
  choicesEl.innerHTML = '';
  const letters = ['a','b','c','d'];
  letters.forEach((lt, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.dataset.letter = lt;
    btn.innerHTML =
      '<span class="choice-letter">' + lt.toUpperCase() + '</span>' +
      '<span>' + qData.choices[lt] + '</span>';
    btn.onclick = () => handleAnswer(lt, btn, qData);
    choicesEl.appendChild(btn);
  });

  // Hide rationale and result
  const rat = document.getElementById('q-rationale');
  rat.classList.remove('visible');
  document.getElementById('rat-text').textContent = '';

  const res = document.getElementById('q-result-row');
  res.className = '';
  res.textContent = '';
  res.style.display = 'none';

  // Hide next btn
  document.getElementById('next-btn').style.display = 'none';
  document.getElementById('skip-btn').style.display = 'inline-flex';

  updateCounter();
}

function handleAnswer(chosen, btn, qData) {
  if (answered) return;
  answered = true;

  const correct = chosen === qData.correct;

  // Style all buttons
  const allBtns = document.querySelectorAll('.choice-btn');
  allBtns.forEach(b => {
    b.disabled = true;
    if (b.dataset.letter === qData.correct) b.classList.add('is-correct');
  });
  if (!correct) btn.classList.add('is-wrong');

  // Result row
  const res = document.getElementById('q-result-row');
  res.style.display = 'flex';
  res.classList.add('visible');
  if (correct) {
    res.className = 'visible correct-res';
    res.innerHTML = '✅ Correct!';
    score.correct++;
    document.getElementById('q-card').classList.add('revealed-correct');
    // If this was previously skipped and now answered correctly, remove from skipped
    skippedSet.delete(queue[qIndex]);
  } else {
    res.className = 'visible wrong-res';
    res.innerHTML = '❌ Incorrect — correct answer is <strong>' + qData.correct.toUpperCase() + '</strong>';
    score.wrong++;
    document.getElementById('q-card').classList.add('revealed-wrong');
  }

  // Rationale
  document.getElementById('rat-text').textContent = qData.rationale;
  document.getElementById('q-rationale').classList.add('visible');

  // Show next
  document.getElementById('next-btn').style.display = 'inline-flex';
  document.getElementById('skip-btn').style.display = 'none';

  updateStats();

  // Scroll rationale into view
  setTimeout(() => {
    document.getElementById('q-rationale').scrollIntoView({behavior:'smooth',block:'nearest'});
  }, 100);
}

function nextQuestion() {
  qIndex++;
  if (qIndex >= queue.length) {
    showFinished();
    return;
  }
  renderQuestion();
  document.getElementById('q-card').scrollIntoView({behavior:'smooth',block:'start'});
}

function skipQuestion() {
  if (answered) return;
  skippedSet.add(queue[qIndex]);
  score.skipped++;
  // Move this question to end of queue so user can come back
  const idx = queue[qIndex];
  queue.splice(qIndex, 1);
  queue.push(idx);
  // qIndex stays the same (now points to next question)
  if (qIndex >= queue.length) {
    // Only skipped questions left
    if (skippedSet.size > 0) {
      // Let them go; user will cycle
    }
    showFinished();
    return;
  }
  updateStats();
  renderQuestion();
}

/* ────────────────────────────────────────────────────────────
   STATS & PROGRESS
   ──────────────────────────────────────────────────────────── */
function updateStats() {
  const answered_ = score.correct + score.wrong;
  document.getElementById('sb-score').textContent    = score.correct;
  document.getElementById('sb-answered').textContent = answered_;
  document.getElementById('sb-skipped').textContent  = skippedSet.size;

  const pct = answered_ > 0 ? Math.round(score.correct / answered_ * 100) : null;
  const pctEl = document.getElementById('sb-pct');
  const bigEl = document.getElementById('score-pct');
  if (pct !== null) {
    pctEl.textContent = pct + '%';
    bigEl.textContent = pct + '%';
    bigEl.className   = pct >= 72 ? 'score-pass' : 'score-fail';
  } else {
    pctEl.textContent = '—';
    bigEl.textContent = '—';
    bigEl.className   = '';
  }

  const total   = DRILL_QUESTIONS.length;
  const done    = Math.min(qIndex, total);
  const fillPct = (done / total * 100).toFixed(1);
  document.getElementById('progress-fill').style.width = fillPct + '%';
}

function updateCounter() {
  const total  = DRILL_QUESTIONS.length;
  const pos    = Math.min(qIndex + 1, total);
  document.getElementById('question-counter').textContent =
    'Q ' + pos + ' of ' + total +
    (skippedSet.size > 0 ? '  ·  ' + skippedSet.size + ' skipped' : '');
}

/* ────────────────────────────────────────────────────────────
   SHUFFLE
   ──────────────────────────────────────────────────────────── */
function toggleShuffle() {
  shuffleMode = !shuffleMode;
  const btn = document.getElementById('shuffle-btn');
  btn.textContent = '🔀 Shuffle: ' + (shuffleMode ? 'ON' : 'OFF');
  btn.classList.toggle('active', shuffleMode);
}

/* ────────────────────────────────────────────────────────────
   RESTART
   ──────────────────────────────────────────────────────────── */
function confirmRestart() {
  if (!confirm('Reset the drill and start from the beginning?')) return;
  restartDrill();
}

function restartDrill() {
  document.getElementById('finished-screen').style.display = 'none';
  document.getElementById('q-card').style.display          = 'block';
  document.getElementById('action-bar').style.display      = 'flex';
  buildQueue();
  updateStats();
  renderQuestion();
}

/* ────────────────────────────────────────────────────────────
   FINISHED SCREEN
   ──────────────────────────────────────────────────────────── */
function showFinished() {
  document.getElementById('q-card').style.display     = 'none';
  document.getElementById('action-bar').style.display = 'none';

  const answered_ = score.correct + score.wrong;
  const pct = answered_ > 0 ? (score.correct / answered_ * 100) : 0;
  const pass = pct >= 72.3;

  document.getElementById('fin-score-val').textContent  = pct.toFixed(1) + '%';
  document.getElementById('fin-pf').textContent         = pass ? '✅ PASS' : '❌ BELOW PASS MARK';
  document.getElementById('fin-pf').className           = 'fin-pf ' + (pass ? 'pass' : 'fail');
  document.getElementById('fin-detail').textContent     =
    'Pass mark: 72.3%  ·  ' + score.correct + '/' + answered_ + ' answered correctly';

  document.getElementById('fs-correct').textContent = score.correct;
  document.getElementById('fs-wrong').textContent   = score.wrong;
  document.getElementById('fs-skipped').textContent = skippedSet.size;
  document.getElementById('fs-total').textContent   = DRILL_QUESTIONS.length;

  const screen = document.getElementById('finished-screen');
  screen.style.display = 'flex';
  screen.scrollIntoView({behavior:'smooth',block:'start'});
}

/* ────────────────────────────────────────────────────────────
   BOOT
   ──────────────────────────────────────────────────────────── */
buildQueue();
updateStats();
renderQuestion();
</script>
